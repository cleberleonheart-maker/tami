name: Build APK TAMI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon.svg'
      - 'version'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A versao vem do arquivo version (ex.: 153|1.53|url), que e a fonte da
      # verdade lida pelo build.gradle. Nao incrementamos aqui: para publicar
      # um APK novo e preciso subir a versao no arquivo version, senao o
      # versionCode repete e o Android recusa a instalacao (downgrade).
      - name: Ler versao
        id: ver
        run: |
          cur=$(cut -d'|' -f1 < version 2>/dev/null || true)
          name=$(cut -d'|' -f2 < version 2>/dev/null || true)
          url=$(cut -d'|' -f3 < version 2>/dev/null || true)
          case "$cur" in ''|*[!0-9]*) echo "::error::versionCode invalido no arquivo version: '$cur'"; exit 1;; esac
          [ -n "$name" ] || { echo "::error::versionName ausente no arquivo version"; exit 1; }
          [ -n "$url" ] || { echo "::error::URL do APK ausente no arquivo version"; exit 1; }
          echo "versionCode=$cur" >> $GITHUB_OUTPUT
          echo "versionName=$name" >> $GITHUB_OUTPUT
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Publicando TAMI $name (versionCode $cur)"

      - name: Empacotar o PWA nos assets do APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon.svg version android/app/src/main/assets/

      - name: Compilar APK de release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      # Impede que o APK com versionCode/Name errados volte a ser publicado:
      # a TAMI ficaria mostrando 1.0 e nunca aceitaria a atualizacao.
      # aapt foi removido das build-tools novas, por isso o aapt2.
      - name: Conferir versao do APK gerado
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          tool=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          [ -n "$tool" ] || tool=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          [ -n "$tool" ] || { echo "::error::aapt2/aapt nao encontrado no runner"; exit 1; }
          badging=$("$tool" dump badging "$apk" | head -1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='${{ steps.ver.outputs.versionCode }}' versionName='${{ steps.ver.outputs.versionName }}'" \
            || { echo "::error::APK nao bate com o arquivo version ($badging)"; exit 1; }

      - name: Publicar o APK direto no repositório
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TAMI.apk
          echo "${{ steps.ver.outputs.versionCode }}|${{ steps.ver.outputs.versionName }}|${{ steps.ver.outputs.url }}" > version
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add TAMI.apk version
          git commit -m "build: APK ${{ steps.ver.outputs.versionName }}" || true
          git push
