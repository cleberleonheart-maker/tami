name: Build APK TAMI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon.svg'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Empacotar o PWA nos assets do APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon.svg version android/app/src/main/assets/

      - name: Compilar APK de release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --no-daemon

      - name: Publicar o APK direto no repositório
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TAMI.apk
          echo "${{ github.run_number }}|1.${{ github.run_number }}|https://cleberleonheart-maker.github.io/tami/TAMI.apk" > version
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add TAMI.apk version
          git commit -m "build: APK ${{ github.run_number }}" || true
          git push
