<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B388FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAMI">
<title>TAMI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script>
(function(){
  function show(msg){
    try{
      var d=document.createElement('div');
      d.setAttribute('id','boot-err');
      d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:9999;background:#7a0a0a;color:#fff;padding:8px 12px;font:11px monospace;white-space:pre-wrap;word-break:break-all';
      d.textContent=msg;
      (document.body||document.documentElement).appendChild(d);
    }catch(e){}
  }
  window.addEventListener('error',function(ev){
    show('TAMI erro: '+(ev.message||'?')+(ev.filename?(' @ '+(ev.filename.split('/').pop())+' '+(ev.lineno||'?')+':'+(ev.colno||'?')):''));
  });
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev.reason; show('TAMI promessa: '+(r&&r.message?r.message:String(r)));
  });
  window.addEventListener('DOMContentLoaded',function(){
    setTimeout(function(){
      try{ if(window.__tamiBooted) return; show('TAMI: app nao terminou de carregar. WebView: '+(navigator.userAgent||'?')); }catch(e){}
    },8000);
  });
})();
</script>
<style>
:root {
  --bg: #0B0F2A;
  --surface: rgba(20,26,58,.55);
  --surface-v: rgba(28,35,74,.35);
  --surface-solid: #141A3A;
  --primary: #00E5FF;
  --primary-dark: #0088CC;
  --secondary: #FF2FD6;
  --tertiary: #B388FF;
  --text: #EAF6FF;
  --text2: #9DB4D5;
  --divider: rgba(0,229,255,.14);
  --glass-b: rgba(255,255,255,.06);
  --glow: 0 0 14px rgba(0,229,255,.55);
  --glow-soft: 0 0 8px rgba(0,229,255,.28);
  --blur: blur(18px) saturate(130%);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background:
    radial-gradient(1200px 600px at 12% -8%, rgba(0,229,255,.16), transparent 60%),
    radial-gradient(1100px 700px at 108% 16%, rgba(255,47,214,.15), transparent 60%),
    radial-gradient(900px 620px at 48% 108%, rgba(179,136,255,.14), transparent 62%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
#bg-anim {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(1200px 600px at 80% -10%, rgba(124,77,255,.18), transparent 60%),
              radial-gradient(900px 500px at 10% 110%, rgba(179,136,255,.10), transparent 60%);
}
#app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

/* Toolbar */
header {
  display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 8px;
  min-height: 56px;
}
#back { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 4px 10px; display: none; }
#back.show { display: block; }
#title { flex: 1; font-size: 20px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#profile-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #1A0B2E; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; cursor: pointer; user-select: none;
}
.tbtn {
  background: none; border: none; color: var(--text2); font-size: 20px;
  cursor: pointer; padding: 8px; border-radius: 50%; line-height: 1;
}
.tbtn:hover { color: var(--text); background: var(--surface-v); }

/* Tabs */
main { flex: 1; overflow-y: auto; padding-bottom: 8px; }
.tab { display: none; }
.tab.active { display: block; }

/* Lists */
.list { padding: 4px 8px 16px; }
#search-wrap { padding: 0 12px 6px; position: sticky; top: 0; z-index: 9; background: var(--bg); }
#search { width: 100%; background: var(--surface); border: 1px solid var(--divider); color: var(--text); border-radius: 22px; padding: 10px 16px; font-size: 15px; outline: none; }
#search:focus { border-color: var(--primary); }
.p-vol { display: flex; align-items: center; gap: 10px; padding: 0 24px 18px; }
.p-vol .pl { color: var(--text2); font-size: 16px; }
.p-vol .pr { color: var(--primary); font-size: 13px; font-weight: 700; cursor: pointer; min-width: 34px; text-align: right; user-select: none; }
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 8px; border-radius: 12px; cursor: pointer;
}
.item:hover { background: var(--surface); }
#amb-list .item.active { background: var(--surface-v); border: 1px solid var(--divider); }
.art {
  width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff; font-size: 18px; overflow: hidden;
}
.art img { width: 100%; height: 100%; object-fit: cover; }
.art.small { width: 42px; height: 42px; font-size: 15px; }
.it-title { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it-sub { font-size: 12.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.mid { flex: 1; min-width: 0; }
.like {
  background: none; border: none; color: var(--text2); font-size: 20px;
  cursor: pointer; padding: 6px; line-height: 1;
}
.like.fav { color: var(--primary); }

/* Section headers */
.section {
  display: flex; align-items: center; gap: 8px;
  padding: 16px 16px 6px; color: var(--text2);
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
}

/* Empty state */
.empty { text-align: center; color: var(--text2); padding: 48px 24px; line-height: 1.6; }
.empty .big { font-size: 44px; margin-bottom: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--primary-dark); color: #fff; border: none;
  border-radius: 24px; padding: 12px 22px; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 14px;
}
.btn.secondary { background: var(--surface-v); color: var(--text); }

/* Bottom nav */
nav {
  display: flex; justify-content: space-around;
  background: var(--surface); border-top: 1px solid var(--divider);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav button {
  flex: 1; background: none; border: none; color: var(--text2);
  font-size: 11px; padding: 8px 4px 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
nav button .ic { font-size: 20px; line-height: 1; }
nav button.active { color: var(--primary); }

/* Mini player */
#mini {
  display: none; align-items: center; gap: 10px;
  background: var(--surface); border-top: 1px solid var(--divider);
  padding: 8px 12px; cursor: pointer;
}
#mini.show { display: flex; }
.mm { color: var(--text2); background: none; border: none; font-size: 22px; cursor: pointer; padding: 6px; line-height: 1; }
.mm.primary { color: var(--primary); }

/* Player overlay */
#player {
  position: fixed; inset: 0; z-index: 20;
  background: linear-gradient(160deg, #1A0B2E 0%, #121212 55%);
  display: none; flex-direction: column;
}
#player.show { display: flex; }
.p-top { display: flex; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 0; }
.p-top button { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 10px; }
.p-top span { flex: 1; text-align: center; font-size: 14px; color: var(--text2); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.p-art {
  width: min(72vw, 320px); aspect-ratio: 1; margin: 6vh auto 0;
  border-radius: 18px; overflow: hidden;
  background: var(--surface-v);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 18px 50px rgba(124,77,255,.3);
}
.p-art img, .p-art video { width: 100%; height: 100%; object-fit: cover; }
.p-art .ph { font-size: 90px; font-weight: 800; color: var(--primary); }
.p-info { padding: 28px 24px 8px; }
.p-title { font-size: 21px; font-weight: 700; text-align: center; }
.p-sub { font-size: 14px; color: var(--text2); text-align: center; margin-top: 6px; }
.p-seek { padding: 8px 22px 0; }
.p-vis { padding: 6px 24px 0; position: relative; }
.vis-btn { position: absolute; right: 26px; top: 8px; background: rgba(20,26,58,.45); border: 1px solid var(--divider); color: var(--primary); font-size: 13px; cursor: pointer; padding: 2px 8px; border-radius: 10px; line-height: 1.4; }
.vis-btn:hover { border-color: var(--primary); }
#vis { width: 100%; height: 46px; display: block; opacity: .85; filter: drop-shadow(0 0 10px rgba(0,229,255,.25)); }
.p-time { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text2); padding: 4px 2px 0; }
input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: var(--surface-v); outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--primary); cursor: pointer; border: none; }
.p-controls { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 18px 0 30px; }
.pc {
  background: none; border: none; color: var(--text); font-size: 26px;
  cursor: pointer; padding: 10px; line-height: 1; width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
}
.pc.primary { color: var(--primary); }
.pc.big { font-size: 44px; width: 74px; height: 74px; }

/* Dialogs */
#modal-wrap { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; }
#modal-wrap.show { display: flex; }
#modal {
  width: 100%; max-width: 480px; background: var(--surface);
  border-radius: 20px 20px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);
}
#modal h3 { margin: 0 0 12px; font-size: 17px; }
#modal input[type=text] {
  width: 100%; background: var(--surface-v); border: 1px solid var(--divider);
  color: var(--text); border-radius: 10px; padding: 12px; font-size: 15px; outline: none;
}
#modal .mrow {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px;
  border-bottom: 1px solid var(--divider); cursor: pointer;
}
#modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }

/* misc */
html.light {
  --bg: #F5F3FA; --surface: #FFFFFF; --surface-v: #EDEAF5;
  --primary: #7C4DFF; --primary-dark: #5E35B1;
  --text: #1C1A23; --text2: #6E6A7A; --divider: #E3E0EC;
}
html.light #player { background: linear-gradient(160deg, #EFEAFA 0%, #F5F3FA 55%); }
html.light .p-art { box-shadow: 0 18px 50px rgba(124,77,255,.18); }
html.light #drop-overlay { background: rgba(124,77,255,.15); color: var(--primary-dark); }
#drop-overlay {
  position: fixed; inset: 0; z-index: 50; display: none;
  align-items: center; justify-content: center; text-align: center;
  background: rgba(124,77,255,.22); border: 3px dashed var(--primary);
  color: #fff; font-size: 18px; font-weight: 600; pointer-events: none;
}
#drop-overlay.show { display: flex; }
.hidden { display: none !important; }
.toast {
  position: fixed; z-index: 40; bottom: 96px; left: 50%; transform: translateX(-50%);
  background: var(--surface-v); color: var(--text); padding: 12px 20px;
  border-radius: 24px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
  opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 86vw; text-align: center;
}
.toast.show { opacity: 1; }
.grad-a { background: linear-gradient(135deg,#FF6B8A,#C44569); }
.grad-b { background: linear-gradient(135deg,#54A0FF,#2E86DE); }
.grad-c { background: linear-gradient(135deg,#5CD859,#26A65A); }
.grad-d { background: linear-gradient(135deg,#FFA502,#E67E22); }
.grad-e { background: linear-gradient(135deg,#B388FF,#7C4DFF); }
.v-hero { text-align: center; padding: 26px 16px 8px; }
.v-logo { font-size: 72px; line-height: 1; filter: drop-shadow(0 8px 22px rgba(255,110,199,.4)); }
.v-avatar {
  width: 108px; height: 108px; margin: 0 auto; position: relative; cursor: pointer;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 28%, #FFE3F2, #FF8AD0 48%, #B388FF 100%);
  box-shadow: 0 0 34px rgba(255,110,199,.55), inset 0 -10px 20px rgba(124,77,255,.35), inset 0 6px 12px rgba(255,255,255,.5);
  animation: tami-bob 3.2s ease-in-out infinite;
  transition: transform .2s;
}
.v-avatar:active { transform: scale(.95); }
.v-avatar .v-bow { position: absolute; top: -8px; right: 4px; font-size: 30px; filter: drop-shadow(0 3px 6px rgba(255,110,199,.6)); transform: rotate(12deg); }
.v-avatar .face { position: absolute; inset: 0; }
.v-avatar .eye {
  position: absolute; top: 42%; width: 13px; height: 16px; border-radius: 50%;
  background: #33113A; animation: tami-blink 4.2s infinite;
}
.v-avatar .eye.l { left: 28%; } .v-avatar .eye.r { right: 28%; animation-delay: .06s; }
.v-avatar .eye::after { content: ''; position: absolute; top: 3px; left: 4px; width: 5px; height: 5px; border-radius: 50%; background: #fff; opacity: .95; }
.v-avatar .blush { position: absolute; top: 58%; width: 18px; height: 10px; border-radius: 50%; background: rgba(255,55,140,.55); filter: blur(1.5px); }
.v-avatar .blush.l { left: 16%; } .v-avatar .blush.r { right: 16%; }
.v-avatar .mouth {
  position: absolute; left: 50%; top: 60%; width: 20px; height: 9px;
  transform: translateX(-50%); border-bottom: 3px solid #33113A;
  border-radius: 0 0 14px 14px;
}
.v-avatar.playing { animation: tami-dance .55s ease-in-out infinite; }
.v-avatar.playing .mouth { height: 14px; border-radius: 0 0 16px 16px; }
.v-avatar.sleep { animation: tami-bob 4.6s ease-in-out infinite; filter: saturate(.65); }
.v-avatar.sleep .eye { animation: none; height: 3px; border-radius: 2px; }
.v-avatar.sleep .eye::after { display: none; }
@keyframes tami-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes tami-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes tami-dance { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
.v-name { font-size: 30px; font-weight: 800; margin-top: 8px; background: linear-gradient(90deg,#FF6EC7,#B388FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
.v-status { font-size: 13px; color: var(--text2); margin-top: 6px; }
.v-status.on { color: var(--primary); font-weight: 700; }
.v-actions { display: flex; gap: 10px; padding: 14px 16px 6px; }
.v-now { margin-top: 12px; }
.v-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 16px 16px; }
.v-card { background: var(--surface); border: 1px solid var(--divider); border-radius: 14px; padding: 14px; text-align: center; cursor: pointer; }
.v-card.on { border-color: var(--primary); background: var(--surface-v); }
.v-ic { font-size: 26px; }
.v-l { font-weight: 700; margin-top: 4px; font-size: 14px; }
.v-s { font-size: 11.5px; color: var(--text2); margin-top: 2px; }

/* Celular (remote) */
#phone-view .phone-card {
  background: var(--surface); border: 1px solid var(--divider);
  border-radius: 16px; padding: 16px; margin: 8px 0 16px;
}
#phone-view .phone-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text2); margin-bottom: 10px;
}
#phone-view .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text2); flex-shrink: 0; }
#phone-view .dot.on { background: #5CD859; box-shadow: 0 0 8px #5CD859; }
#phone-view .phone-song { display: flex; align-items: center; gap: 12px; }
#phone-view .phone-song .art { width: 54px; height: 54px; }
#phone-view .phone-song .it-title { font-size: 16px; }
#phone-view .phone-controls {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; margin: 14px 0 6px;
}
#phone-view .phone-controls button {
  background: none; border: none; color: var(--text); font-size: 24px;
  cursor: pointer; padding: 8px; line-height: 1; width: 46px; height: 46px;
}
#phone-view .phone-controls .pmain { color: var(--primary); font-size: 38px; width: 66px; height: 66px; }
#phone-view .pseek { margin: 8px 0 2px; }
#phone-view .pvol {
  display: flex; align-items: center; gap: 10px; margin-top: 10px;
  color: var(--text2); font-size: 14px;
}
#phone-view .phone-clist { margin-top: 6px; }
#phone-view .phone-clist .item { padding: 8px; }
#phone-view .phone-clist .item.play { background: var(--surface-v); border: 1px solid var(--divider); border-radius: 12px; }
#phone-view .elink {
  color: var(--primary); cursor: pointer; font-size: 13px; font-weight: 700;
  padding: 6px; display: inline-flex; align-items: center; gap: 6px;
}
</style>
<style id="redesign-futuro">
/* Futurista sci-fi: fundo em grade neon animado + glassmorphism neon em todos os painéis Virgin Virgin */
:root {
  --redesign-glow: #00E5FF;
  --redesign-glow2: #FF2FD6;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1200px 800px at 110% -10%, rgba(0,229,255,.18), transparent 55%),
    radial-gradient(1000px 700px at -10% 110%, rgba(255,47,214,.16), transparent 55%),
    radial-gradient(700px 500px at 60% 6%, rgba(179,136,255,.12), transparent 60%);
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,229,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,.05) 1px, transparent 1px);
  background-size: 38px 38px; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
}
.v-grid, .list, .alb-grid, .grid {
  backdrop-filter: blur(10px) saturate(140%);
}
.v-card, .item, .mrow, .empty, .section {
  background: rgba(20,26,58,.5) !important;
  border: 1px solid rgba(0,229,255,.14) !important;
  backdrop-filter: blur(12px) saturate(150%);
}
.v-card {
  transition: transform .18s ease, box-shadow .2s ease, border-color .2s ease;
}
.v-card:hover, .item:hover, .mrow:hover {
  border-color: rgba(0,229,255,.55) !important;
  box-shadow: 0 0 24px rgba(0,229,255,.25), inset 0 0 12px rgba(0,229,255,.08);
  transform: translateY(-2px);
}
.v-card.on { border-color: #FF2FD6 !important; box-shadow: 0 0 26px rgba(255,47,214,.4); }
.grad-a { background: linear-gradient(135deg,#FF2FD6,#7C4DFF) !important; }
.grad-b { background: linear-gradient(135deg,#00E5FF,#0088FF) !important; }
.grad-c { background: linear-gradient(135deg,#30FFC0,#00B8D9) !important; }
.grad-d { background: linear-gradient(135deg,#FF9E2C,#FF2FD6) !important; }
.grad-e { background: linear-gradient(135deg,#B388FF,#FF2FD6) !important; }
.v-ic { filter: drop-shadow(0 0 10px rgba(0,229,255,.5)); }
.it-title, .v-l, .it-title { text-shadow: 0 0 16px rgba(0,229,255,.35); }
.empty .big { text-shadow: 0 0 40px rgba(0,229,255,.7); }
@keyframes redes-futuro-flut {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-3px) rotate(1.5deg); }
}
.v-ic { animation: redes-futuro-flut 3.5s ease-in-out infinite; }
</style>
</head>
<body>
<div id="bg-anim"></div>
<div id="app">
  <header>
    <button id="back" onclick="goBack()">←</button>
    <div id="title">TAMI</div>
    <button class="tbtn" id="addPlaylistBtn" onclick="addPlaylist()" title="Nova playlist">＋</button>
    <div id="profile-avatar" onclick="showProfile()">T</div>
  </header>
  <main id="main">
    <div id="search-wrap"><input type="search" id="search" placeholder="Buscar músicas, artistas…" autocomplete="off"></div>
    <section class="tab active" id="tab-virgin">
      <div class="list" id="virgin-list"></div>
    </section>
    <section class="tab" id="tab-songs">
      <div class="list" id="songs-list"></div>
    </section>
    <section class="tab" id="tab-albums">
      <div class="list" id="albums-list"></div>
    </section>
    <section class="tab" id="tab-artists">
      <div class="list" id="artists-list"></div>
    </section>
    <section class="tab" id="tab-playlists">
      <div class="list" id="playlists-list"></div>
    </section>
    <section class="tab" id="tab-favs">
      <div class="list" id="favs-list"></div>
    </section>
    <section class="tab" id="tab-videos">
      <div class="list" id="videos-list"></div>
    </section>
    <section class="tab" id="tab-amb">
      <div class="list" id="amb-list"></div>
    </section>
    <section class="tab" id="tab-phone">

<script>
'use strict';
// ---------- Estado ----------
const state = {
  songs: [], videos: [], playlists: [],
  tab: 'songs', detail: null, // {type:'album'|'artist'|'playlist', ...}
  queue: [], queueIndex: -1, current: null,
  shuffle: false, repeat: 0, favs: new Set(), nick: '', theme: 'dark', visStyle: 'hearts',
  djMode: false, djVoice: true, djMic: false, learn: {},
  radio: false, djLocutor: false,
  amb: { id: null, vol: 0.4, playing: false },
  sleep: 0, sleepId: null,
  phone: { dev: '', online: false, state: null, songs: null, syncing: false },
  db: null
};

const $ = (id) => document.getElementById(id);
const audio = $('audio'), video = $('video');
const UNKNOWN = 'Desconhecido';
const REMOTE = (location.protocol.startsWith('http') ? location.origin : '') || 'http://192.168.100.7:8081';
const VERSION_URL = 'https://cleberleonheart-maker.github.io/tami/version';

// ---------- IndexedDB ----------
function openDB() {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => resolve(null), 3000);
    try {
      const req = indexedDB.open('tami-app', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('songs')) db.createObjectStore('songs', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('playlists')) db.createObjectStore('playlists', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess = () => { clearTimeout(t); resolve(req.result); };
      req.onerror = () => { clearTimeout(t); reject(req.error); };
    } catch (e) { clearTimeout(t); reject(e); }
  });
}
function tx(store, mode) { return state.db.transaction(store, mode).objectStore(store); }
function getAll(store) {
  if (!state.db) return Promise.resolve([]);
  return new Promise((res, rej) => {
    const t = setTimeout(() => res([]), 3000);
    try {
      const r = tx(store).getAll();
      r.onsuccess = () => { clearTimeout(t); res(r.result || []); };
      r.onerror = () => { clearTimeout(t); rej(r.error); };
    } catch (e) { clearTimeout(t); rej(e); }
  });
}
function putKV(k, v) {
  if (!state.db) return Promise.resolve();
  return new Promise((res, rej) => {
    const t = setTimeout(() => res(), 3000);
    try {
      const r = tx('kv', 'readwrite').put(v, k);
      r.onsuccess = () => { clearTimeout(t); res(); };
      r.onerror = () => { clearTimeout(t); rej(r.error); };
    } catch (e) { clearTimeout(t); rej(e); }
  });
}
function getKV(k) {
  if (!state.db) return Promise.resolve(undefined);
  return new Promise((res) => {
    const t = setTimeout(() => res(undefined), 3000);
    try {
      const r = tx('kv').get(k);
      r.onsuccess = () => { clearTimeout(t); res(r.result); };
      r.onerror = () => { clearTimeout(t); res(undefined); };
    } catch (e) { clearTimeout(t); res(undefined); }
  });
}
function clearStore(store) {
  if (!state.db) return Promise.resolve();
  return new Promise((res, rej) => {
    const t = setTimeout(() => res(), 3000);
    try {
      const r = tx(store, 'readwrite').clear();
      r.onsuccess = () => { clearTimeout(t); res(); };
      r.onerror = () => { clearTimeout(t); rej(r.error); };
    } catch (e) { clearTimeout(t); rej(e); }
  });
}

// ---------- Util ----------
function fmtTime(ms) {
  const s = Math.floor((ms || 0) / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function grad(idx) { return ['grad-a', 'grad-b', 'grad-c', 'grad-d', 'grad-e'][idx % 5]; }
function initials(name) {
  const parts = String(name || '?').trim().split(/\s+/);
  return (parts[0][0] || '?') + (parts.length > 1 ? parts[parts.length - 1][0] : '').toUpperCase();
}
function esc(s) { return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
let searchQ = '';
function matched(...vals) { return vals.some((v) => String(v || '').toLowerCase().includes(searchQ)); }
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- Leitura de metadados (ID3) ----------
function readHead(file, size) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(new Uint8Array(fr.result));
    fr.onerror = () => rej(fr.error);
    fr.readAsArrayBuffer(file.slice(0, Math.min(size, file.size)));
  });
}
function tv4size(b, at) { return ((b[at] & 0x7f) << 21) | ((b[at + 1] & 0x7f) << 14) | ((b[at + 2] & 0x7f) << 7) | (b[at + 3] & 0x7f); }
function tv3size(b, at) { return ((b[at] & 0xff) << 24) | ((b[at + 1] & 0xff) << 16) | ((b[at + 2] & 0xff) << 8) | (b[at + 3] & 0xff); }
function decodeText(enc, bytes) {
  try {
    if (enc === 3) return new TextDecoder('utf-8').decode(bytes);
    if (enc === 0) return new TextDecoder('latin1').decode(bytes);
    if (enc === 2) return new TextDecoder('utf-16be').decode(bytes);
    let s = new TextDecoder('utf-16le').decode(bytes);
    s = s.replace(/^\uFEFF/, '');
    return s;
  } catch (e) { return ''; }
}
function stripNull(s) { return String(s).replace(/\u0000/g, '').trim(); }
function parseId3(file, bytes) {
  const meta = { title: '', artist: '', album: '', year: '', cover: null, index: null };
  if (bytes.length < 10 || bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x53) return meta;
  const ver = bytes[3];
  let size;
  if (ver === 2) {
    size = tv4size(bytes, 6);
    let pos = 10, end = Math.min(10 + size, bytes.length);
    while (pos + 6 <= end) {
      const id = String.fromCharCode(bytes[pos], bytes[pos + 1], bytes[pos + 2]);
      const fsize = tv3size(bytes, pos + 3);
      const data = bytes.slice(pos + 6, pos + 6 + fsize);
      applyFrame(meta, id, data, 2);
      pos += 6 + fsize;
    }
  } else {
    size = tv4size(bytes, 6);
    const flags = bytes[5];
    let pos = 10;
    if (flags & 0x40) pos += tv4size(bytes, 10); // ext header
    let end = Math.min(10 + size, bytes.length);
    while (pos + 10 <= end) {
      const id = String.fromCharCode(bytes[pos], bytes[pos + 1], bytes[pos + 2], bytes[pos + 3]);
      if (!id.replace(/\0/g, '')) break;
      const fsize = ver === 4 ? tv4size(bytes, pos + 4) : tv3size(bytes, pos + 4);
      const data = bytes.slice(pos + 10, pos + 10 + fsize);
      applyFrame(meta, id, data, ver);
      pos += 10 + fsize;
    }
  }
  return meta;
}
function applyFrame(meta, id, data, ver) {
  const textLens = ['TIT2', 'TPE1', 'TALB', 'TYER', 'TCON'];
  const q = { TT2: 'TIT2', TP1: 'TPE1', TAL: 'TALB', TYE: 'TYER', TCO: 'TCON' };
  const real = q[id] || id;
  if (textLens.includes(real)) {
    if (data.length < 2) return;
    const enc = data[0];
    let text = decodeText(enc, data.slice(1));
    if (enc === 1) {
      text = text.replace(/\u0000+$/, '');
      if (!text && data.length > 3) text = decodeText(enc, data.slice(4)).replace(/\u0000+$/, '');
    }
    text = stripNull(text);
    if (real === 'TIT2') meta.title = text;
    else if (real === 'TPE1') meta.artist = text;
    else if (real === 'TALB') meta.album = text;
    else if (real === 'TYER') meta.year = text;
  } else if (id === 'APIC') {
    if (data.length < 6) return;
    const enc = data[0];
    function nullEnd(start) {
      if (enc === 1 || enc === 2) {
        for (let i = start; i + 1 < data.length; i++) if (data[i] === 0 && data[i + 1] === 0) return i;
        return data.length;
      }
      for (let i = start; i < data.length; i++) if (data[i] === 0) return i;
      return data.length;
    }
    const mimeEnd = nullEnd(1);
    const mime = String.fromCharCode.apply(null, Array.from(data.slice(1, mimeEnd)));
    let p = mimeEnd + 1;
    const typeByte = data[p]; p++;
    p = nullEnd(p) + (enc === 1 || enc === 2 ? 2 : 1);
    const img = data.slice(p);
    if (img.length > 100) {
      meta.cover = { mime: mime || 'image/jpeg', blob: new Blob([img], { type: mime || 'image/jpeg' }) };
    }
    if (typeByte === 0x03 || typeByte === 0x04) meta.index = 1; // front cover
  }
}
function fallbackName(name) {
  let cn = stripNull(name).replace(/\.[^.]+$/, '').trim();
  const sep = cn.lastIndexOf(' - ');
  if (sep > 0) return { title: cn.slice(sep + 3).trim() || cn, artist: cn.slice(0, sep).trim() };
  return { title: cn, artist: '' };
}
function metadataOf(file) {
  return readHead(file, 512 * 1024).then((bytes) => {
    const m = parseId3(file, bytes);
    if (m.title) return m;
    const f = fallbackName(file.name);
    return { title: f.title, artist: f.artist, album: '', year: '', cover: null };
  });
}
function durationOf(file, isVideo) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const el = isVideo ? document.createElement('video') : document.createElement('audio');
    el.preload = 'metadata';
    el.src = url;
    const done = () => { resolve(el.duration ? el.duration * 1000 : 0); URL.revokeObjectURL(url); };
    el.onloadedmetadata = done;
    el.onerror = () => { resolve(0); URL.revokeObjectURL(url); };
    setTimeout(() => { el.onloadedmetadata = null; el.onerror = null; URL.revokeObjectURL(url); resolve(0); }, 15000);
  });
}

// ---------- Importação ----------
async function importFiles(fileList, kind) {
  const existing = new Set();
  const seeds = kind === 'song' ? state.songs : state.videos;
  for (const it of seeds) {
    const b = it.blob || {};
    existing.add((b.lastModified || it.createdAt || 0) + '|' + (b.size || it.sizeBytes || 0) + '|' + it.name);
  }
  let added = 0, skipped = 0;
  toast(`Importando ${fileList.length} arquivos…`);
  if (!state.db) { toast('Armazenamento indisponível: não é possível importar músicas.'); return; }
  for (const file of fileList) {
    const key = (file.lastModified || 0) + '|' + file.size + '|' + file.name;
    if (existing.has(key)) { skipped++; continue; }
    existing.add(key);
    try {
      if (kind === 'song') {
        const meta = await metadataOf(file);
        const dur = await durationOf(file, false);
        await putSong({
          id: 's' + (file.lastModified) + '-' + Math.random().toString(36).slice(2, 8),
          title: meta.title || file.name, artist: meta.artist || 'Artista desconhecido',
          album: meta.album || UNKNOWN, year: meta.year || (new Date().getFullYear()),
          durationMs: dur, cover: meta.cover ? meta.cover.blob : null,
          coverMime: meta.cover ? meta.cover.mime : null,
          type: 'song', createdAt: Date.now(), blob: file, name: file.name
        });
      } else {
        const dur = await durationOf(file, true);
        await putVideo({
          id: 'v' + Math.random().toString(36).slice(2, 10),
          title: file.name.replace(/\.[^.]+$/, '').trim(), durationMs: dur,
          sizeBytes: file.size, type: 'video', blob: file, name: file.name, createdAt: Date.now()
        });
      }
      added++;
    } catch (e) { console.warn('falha ao importar', file.name, e); }
  }
  await reloadAll();
  toast(`Importadas ${added} ${kind === 'song' ? 'músicas' : 'vídeos'}${skipped ? ` (${skipped} duplicada${skipped === 1 ? '' : 's'} ignorada${skipped === 1 ? '' : 's'})` : ''}.`);
  if (added && kind === 'song') buildAlbums();
}
function putSong(s) { return new Promise((res, rej) => { const r = tx('songs', 'readwrite').put(s); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function putVideo(v) { return new Promise((res, rej) => { const r = tx('videos', 'readwrite').put(v); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function delObj(store, id) { return new Promise((res, rej) => { const r = tx(store, 'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

// ---------- Álbuns / Artistas ----------
let albums = [], artists = [];
const SPEEDS = [1, 1.25, 1.5, 1.75, 2, 0.75];
let speedIdx = 0;
function buildAlbums() {
  const map = new Map();
  const amap = new Map();
  for (const s of state.songs) {
    if (!map.has(s.album)) map.set(s.album, []);
    map.get(s.album).push(s);
    if (!amap.has(s.artist)) amap.set(s.artist, []);
    amap.get(s.artist).push(s);
  }
  albums = [...map.entries()].map(([name, songs]) => ({ name, artist: songs[0] && songs[0].artist || '', numSongs: songs.length, songs }));
  artists = [...amap.entries()].map(([name, songs]) => ({ name, numSongs: songs.length }));
}
function urlOfSong(s) { return URL.createObjectURL(s.blob); }

// ---------- Render ----------
const CUTE_ICONS = ['🌸', '💖', '⭐', '🌙', '🦋', '🎀', '🌷', '✨', '🌺', '💫', '🍓', '🌼'];
function seedHash(str) { let h = 0; for (const c of String(str || '?')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function cuteIcon(seed) { return CUTE_ICONS[seedHash(seed) % CUTE_ICONS.length]; }
function renderArt(art, s, size) {
  art.className = 'art ' + (size || '');
  art.textContent = '';
  if (s.coverUrl) {
    const img = document.createElement('img');
    img.src = s.coverUrl;
    art.appendChild(img);
  } else if (s.cover) {
    const img = document.createElement('img');
    img.src = coverUrl(s);
    art.appendChild(img);
  } else {
    const seed = s.album === UNKNOWN ? (s.title || s.artist) : s.album;
    art.textContent = cuteIcon(seed);
    art.classList.add(grad(seedHash(seed) % 5));
  }
}
function renderSongs(list, container, favOnly) {
  container.innerHTML = '';
  if (!list.length) {
    if (searchQ) { container.innerHTML = `<div class="empty"><div class="big">?</div>Nada encontrado para <b>${esc(searchQ)}</b>.</div>`; return; }
    container.innerHTML = `<div class="empty"><div class="big">♪</div>${
      favOnly ? 'Nenhuma favorita ainda. Toque no coração para favoritar.' : 'Nenhuma música. Importe seus arquivos abaixo.'
    }<br><button class="btn" onclick="$('fileSongs').click()">＋ Importar músicas</button></div>`;
    return;
  }
  for (const s of list) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<div class="art" id="a-${s.id}"></div>
      <div class="mid"><div class="it-title">${esc(s.title)}</div><div class="it-sub">${esc(s.artist)} · ${esc(s.album)}</div></div>
      <button class="like ${state.favs.has(s.id) ? 'fav' : ''}" data-fav="${s.id}">${state.favs.has(s.id) ? '♥' : '♡'}</button>
      <button class="like" data-del="${s.id}" title="Excluir">🗑</button>`;
    row.onclick = () => playList(list, s);
    row.querySelector('[data-fav]').onclick = (e) => { e.stopPropagation(); toggleFav(s); };
    row.querySelector('[data-del]').onclick = (e) => { e.stopPropagation(); delSong(s.id); };
    renderArt(row.childNodes[0], s);
    container.appendChild(row);
  }
}
function renderAlbums(container, list) {
  container.innerHTML = '';
  if (!list.length) {
    if (searchQ) { container.innerHTML = `<div class="empty"><div class="big">?</div>Nada encontrado para <b>${esc(searchQ)}</b>.</div>`; return; }
    container.innerHTML = `<div class="empty"><div class="big">▣</div>Sem álbuns.<br><button class="btn" onclick="importPrompt(false)">＋ Importar músicas</button></div>`;
    return;
  }
  for (const al of list) {
    const row = document.createElement('div');
    row.className = 'item';
    const any = al.songs[0];
    row.innerHTML = `<div class="art grad-c"></div>
      <div class="mid"><div class="it-title">${esc(al.name)}</div><div class="it-sub">${esc(al.artist)} · ${al.numSongs} ${al.numSongs === 1 ? 'música' : 'músicas'}</div></div>`;
    row.onclick = () => openDetail({ type: 'album', name: al.name, artist: al.artist, songs: al.songs });
    renderArt(row.childNodes[0], any);
    container.appendChild(row);
  }
}
function renderArtists(container) {
  container.innerHTML = '';
  const list = searchQ ? artists.filter((ar) => matched(ar.name)) : artists;
  if (!list.length) {
    if (searchQ) { container.innerHTML = `<div class="empty"><div class="big">?</div>Nada encontrado para <b>${esc(searchQ)}</b>.</div>`; return; }
    container.innerHTML = `<div class="empty"><div class="big">◎</div>Sem artistas ainda.</div>`;
    return;
  }
  for (const ar of list) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<div class="art ${grad(ar.name.length)}">${esc(initials(ar.name))}</div>
      <div class="mid"><div class="it-title">${esc(ar.name)}</div><div class="it-sub">${ar.numSongs} ${ar.numSongs === 1 ? 'música' : 'músicas'}</div></div>`;
    row.onclick = () => openDetail({ type: 'artist', name: ar.name, songs: state.songs.filter((s) => s.artist === ar.name) });
    container.appendChild(row);
  }
}
function renderPlaylists(container) {
  container.innerHTML = '';
  const list = searchQ
    ? state.playlists.filter((pl) => {
        const s = state.songs.filter((x) => (pl.songIds || []).includes(x.id));
        return matched(pl.name) || s.some((x) => matched(x.title, x.artist));
      })
    : state.playlists;
  if (!list.length) {
    if (searchQ) { container.innerHTML = `<div class="empty"><div class="big">?</div>Nada encontrado para <b>${esc(searchQ)}</b>.</div>`; return; }
    container.innerHTML = `<div class="empty"><div class="big">☰</div>Nenhuma playlist.<br><button class="btn" onclick="addPlaylist()">＋ Criar playlist</button></div>`;
    return;
  }
  for (const pl of list) {
    const songs = state.songs.filter((s) => (pl.songIds || []).includes(s.id));
    const row = document.createElement('div');
    row.className = 'item';

// ---------- Som de fundo (ambiente) ----------
let ambCtx = null, ambBus = null, ambNodes = [];
const AMBIENT_SOUNDS = [
  { id: 'chuva', icon: '🌧️', name: 'Chuva', sub: 'Chuva constante e calma' },
  { id: 'mar', icon: '🌊', name: 'Mar', sub: 'Ondas do oceano' },
  { id: 'vento', icon: '🌬️', name: 'Vento', sub: 'Brisa e ventania' },
  { id: 'fogo', icon: '🔥', name: 'Fogueira', sub: 'Crepitar de brasas' },
  { id: 'grilos', icon: '🌙', name: 'Noite', sub: 'Grilos e silêncio' },
  { id: 'riacho', icon: '🏞️', name: 'Riacho', sub: 'Água corrente' },
  { id: 'branco', icon: '⬜', name: 'Ruído branco', sub: 'Foco e concentração' },
  { id: 'rosa', icon: '🌸', name: 'Ruído rosa', sub: 'Som suave e acolhedor' }
];
function ambNoise(type) {
  const rate = ambCtx.sampleRate;
  const buf = ambCtx.createBuffer(1, rate * 4, rate);
  const ch = buf.getChannelData(0);
  if (type === 'white') {
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  } else if (type === 'pink') {
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < ch.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      ch[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
  } else {
    let last = 0;
    for (let i = 0; i < ch.length; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      ch[i] = last * 3.5;
    }
  }
  const src = ambCtx.createBufferSource();
  src.buffer = buf; src.loop = true;
  return src;
}
function ambLfo(freq, depth, target, base) {
  const osc = ambCtx.createOscillator();
  osc.frequency.value = freq;
  const lg = ambCtx.createGain();
  lg.gain.value = depth;
  const g = ambCtx.createGain();
  g.gain.value = base;
  osc.connect(lg).connect(g.gain);
  g.connect(target);
  osc.start();
  return osc;
}
function ambBuilder(id) {
  const ctx = ambCtx;
  const g = ctx.createGain(); g.gain.value = 1;
  const out = ctx.createGain();
  const st = { stop: [] };
  switch (id) {
    case 'chuva': {
      const src = ambNoise('white');
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 260;
      src.connect(lp); lp.connect(hp); hp.connect(g);
      const lfo = ambLfo(5, 0.12, g.gain, 0.45);
      st.stop.push(src, lfo);
      break;
    }
    case 'mar': {
      const src = ambNoise('brown');
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 320; bp.Q.value = 0.55;
      src.connect(bp); bp.connect(g);
      const lfo = ambLfo(0.07, 0.42, g.gain, 0.5);
      st.stop.push(src, lfo);
      break;
    }
    case 'vento': {
      const src = ambNoise('pink');
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.35;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
      src.connect(bp); bp.connect(hp); hp.connect(g);
      const lfo = ambLfo(0.1, 0.16, g.gain, 0.4);
      st.stop.push(src, lfo);
      break;
    }
    case 'fogo': {
      const src = ambNoise('brown');
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 950;
      src.connect(lp); lp.connect(g);
      const lfo = ambLfo(0.7, 0.22, g.gain, 0.55);
      const crackle = ctx.createBufferSource();
      crackle.buffer = ambNoise('white').buffer;
      crackle.loop = true;
      const cbp = ctx.createBiquadFilter(); cbp.type = 'bandpass'; cbp.frequency.value = 2400; cbp.Q.value = 2;
      const cg = ctx.createGain(); cg.gain.value = 0;
      crackle.connect(cbp); cbp.connect(cg); cg.connect(g);
      const timer = setInterval(() => {
        if (Math.random() < 0.5) {
          const t = ctx.currentTime;
          cg.gain.cancelScheduledValues(t);
          cg.gain.setValueAtTime(0.02 + Math.random() * 0.25, t);
          cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.05 + Math.random() * 0.12);
        }
      }, 90);
      st.stop.push(src, lfo, crackle);
      st.timer = timer;
      break;
    }
    case 'grilos': {
      for (const f of [4300, 4600, 5000]) {
        const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f;
        const og = ctx.createGain(); og.gain.value = 0;
        const flfo = ctx.createOscillator(); flfo.frequency.value = 3 + Math.random() * 2;
        const flg = ctx.createGain(); flg.gain.value = 70;
        flfo.connect(flg).connect(osc.frequency);
        const glfo = ctx.createOscillator(); glfo.frequency.value = 2 + Math.random() * 0.6;
        const glg = ctx.createGain(); glg.gain.value = 0.2;
        glfo.connect(glg).connect(og.gain);
        osc.connect(og); og.connect(g);
        osc.start(); flfo.start(); glfo.start();
        st.stop.push(osc, flfo, glfo);
      }
      break;
    }
    case 'riacho': {
      const src = ambNoise('pink');
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 620; lp.Q.value = 0.3;
      src.connect(lp); lp.connect(g);
      const src2 = ambNoise('pink');
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 1.6;
      const g2 = ctx.createGain(); g2.gain.value = 0.25;
      src2.connect(bp); bp.connect(g2); g2.connect(g);
      const lfo = ambLfo(0.35, 0.12, g2.gain, 0.25);
      const lfo2 = ambLfo(0.9, 0.15, bp.frequency, 1700);
      st.stop.push(src, src2, lfo, lfo2);
      break;
    }
    case 'branco': {
      const src = ambNoise('white');
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200;
      src.connect(lp); lp.connect(g);
      g.gain.value = 0.5;
      st.stop.push(src);
      break;
    }
    case 'rosa': {
      const src = ambNoise('pink');
      src.connect(g);
      g.gain.value = 0.5;
      st.stop.push(src);
      break;
    }
  }
  g.connect(out); out.connect(ambBus);
  st.start = () => { for (const n of st.stop) { if (n.start) { try { n.start(); } catch (e) {} } } };
  st.stopAll = () => {
    if (st.timer) clearInterval(st.timer);
    for (const n of st.stop) {
      if (n.stop) { try { n.stop(); } catch (e) {} }
      try { n.disconnect(); } catch (e) {}
    }
    try { g.disconnect(); out.disconnect(); } catch (e) {}
  };
  return st;
}
function ensureAmbCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { toast('Áudio não suportado neste navegador.'); return false; }
  if (!ambCtx) {
    ambCtx = new AC();
    ambBus = ambCtx.createGain();
    ambBus.gain.value = state.amb.vol;
    ambBus.connect(ambCtx.destination);
  }
  if (ambCtx.state === 'suspended') ambCtx.resume().catch(() => {});
  return true;
}
function ambStop() {
  for (const n of ambNodes) { try { n.stopAll(); } catch (e) {} }
  ambNodes = [];
  state.amb.playing = false;
}
function ambToggle(id) {
  if (!id || !AMBIENT_SOUNDS.some((s) => s.id === id)) return;
  if (state.amb.id === id && state.amb.playing) {
    ambStop();
    state.amb.id = null;
  } else {
    if (!ensureAmbCtx()) return;
    ambStop();
    state.amb.id = id;
    const b = ambBuilder(id);
    ambNodes = [b];
    b.start();
    state.amb.playing = true;
  }
  persistAmb();
  renderAmb();
}
function persistAmb() {
  if (state.db) putKV('amb', { id: state.amb.id, vol: state.amb.vol });
}
function renderAmb() {
  const list = $('amb-list');
  if (!list) return;

    <div class="p-vol" style="padding:6px 12px 4px">

  for (const s of AMBIENT_SOUNDS) {

let djEntered = false, djLearnTimer = 0, djLastId = null, djAnnounced = new Set();
function djLearnGet(id) { return state.learn[id] || { plays: 0, skips: 0, liked: false }; }
function djLearnSet(id, patch) {

function pickDjVoice(u) {
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  const langPref = ['pt', 'pt-BR', 'en', 'es'];
  const pick =
    langPref.map(l => vs.filter(v => (v.lang || '').toLowerCase().startsWith(l.toLowerCase()))
      .find(v => /female|feminina|femenine|woman|mulher/i.test(v.name)))
      .find(Boolean) ||
    langPref.map(l => vs.find(v => (v.lang || '').toLowerCase().startsWith(l.toLowerCase())))
      .find(Boolean) ||
    vs[0];
  if (pick) { u.voice = pick; u.lang = pick.lang; }

async function djSpeak(text) {
  if (!state.djVoice || !text) return;
  try {
    if (window.TamiNative && window.TamiNative.speak) { window.TamiNative.speak(text); return; }
  } catch (e) {}
  if (!('speechSynthesis' in window)) return;
  try {
    await djWaitVoices();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = 1.2; u.rate = 0.95;
    pickDjVoice(u);
    speechSynthesis.speak(u);
  } catch (e) {}
}
function djWaitVoices() {
  if (!('speechSynthesis' in window) || (speechSynthesis.getVoices && speechSynthesis.getVoices().length)) return Promise.resolve();
  return new Promise((r) => {
    let done = false;
    const fin = () => { if (!done) { done = true; r(); } };
    speechSynthesis.addEventListener('voiceschanged', fin, { once: true });
    setTimeout(fin, 1000);
  });
}

}
function djEngine(pool) {
  const set = pool.slice();
  if (!set.length) return [];
  const favSet = new Set(Array.from(state.favs));
  const disliked = [];
  const dislikedSet = new Set();

  const candidatesPool = disliked.length === set.length ? set.slice() : set.filter(s => !dislikedSet.has(s.id));
  const remaining = candidatesPool.slice();
  const out = [];
  const recent = [];
  const cap = 4;
  let guard = 0;
  while (remaining.length && guard < 20000) {
    guard++;
    let pick = null;

}

function djNorm(t) {
  return String(t).toLowerCase()
    .replace(/[áàâãä]/g, 'a').replace(/[éèêë]/g, 'e').replace(/[íìîï]/g, 'i')
    .replace(/[óòôõö]/g, 'o').replace(/[úùûü]/g, 'u').replace(/ç/g, 'c');
}
function djCommand(raw) {
  const norm = djNorm(raw);

    : /relaxa|calma|calm|tranquil|light/.test(norm) ? 'relaxar'
    : /curiosidade|fato curioso|sabia|curios/.test(norm) ? 'curiosidade'
    : /locutor|radio\b|apresenta/.test(norm) ? 'locutor'
    : /piada|zoeira|conta|engracad|sorri/.test(norm) ? 'piada'
    : /timer|dormi|dormir|sleep|deslig|apaga.*(min|minuto)/.test(norm) ? 'timer'
    : /mix|mistura|mixa/.test(norm) ? 'mix'
    : /odia|odeio|nao gostei|nao curti/.test(norm) ? 'dislike'
    : /duplicad|repetid/.test(norm) ? 'dupes'
    : /pula|pular|pule|skip/.test(norm) ? 'skip'
    : /proxima|passa|avanc/.test(norm) ? 'next'
    : /anterior|volta|volt/.test(norm) ? 'prev'
    : /pausa|parar|pare|stop|\bpara (a|o|de|com|por|agora)/.test(norm) ? 'pause'
    : /toca|toque|continua|play|roda/.test(norm) ? 'play'
    : /favorit|curti|gostei|amei/.test(norm) ? 'fav'
    : /qual|essa|tocando|nome/.test(norm) ? 'info'
    : /recomend|suger|sugest|indica|dica/.test(norm) ? 'recomenda'
    : /obrigad|valeu|thanks/.test(norm) ? 'thanks'
    : /oi|ola|hello/.test(norm) ? 'hello'
    : null;
  if (!hasWake) return;
  if (!action) { djSpeak('Desculpa, não entendi. Tente: TAMI, próxima música.'); return; }
  const cur = state.current;
  switch (action) {
    case 'bombar': djSpeak('Bora bombar! Preparando um mix só pra você.'); setTimeout(() => djMix('bombar'), 1500); break;
    case 'relaxar': djSpeak('Pode relaxar. Deixa comigo o clima.'); setTimeout(() => djMix('relaxar'), 1500); break;
    case 'piada': setTimeout(tamiPiada, 600); break;
    case 'curiosidade': {
      djSpeak('Ótimo! Vou te contar uma curiosidade sobre a banda.');
      setTimeout(tamiCuriosidade, 700);
      break;
    }
    case 'locutor': tamiLocutorToggle(); break;
    case 'timer': {
      const m = parseInt((norm.match(/(\d+)/) || [])[1], 10);
      if (m && m > 0 && m <= 120) { djSpeak('Combinado! Desligo em ' + m + ' minutos.'); tamiSleep(m); }
      else { djSpeak('Diga em quantos minutos, por exemplo: TAMI, timer de 20 minutos.'); }
      break;
    }
    case 'mix': djSpeak('Claro! Preparando um mix novo para você.'); setTimeout(djMix, 1500); break;
    case 'recomenda': djSpeak('Deixa eu pensar aqui...'); setTimeout(tamiRecomenda, 800); break;
    case 'dislike':
      djMarkDislike();
      djSpeak('Entendido! Não vou tocar essa por um tempo.');

      break;
    case 'dupes':

      break;
    case 'skip':

      djSpeak('Pulada!');

      break;
    case 'next':

    case 'prev': djSpeak('Voltando!'); prev(); break;
    case 'pause': {
      const el2 = state.current && state.current.type === 'video' ? video : audio;
      if (el2.src && !el2.paused) { el2.pause(); djSpeak('Pausado!'); }
      break;
    }

function learnArtistPref() {
  const pref = {};
  for (const s of state.songs) {
    const k = s.artist || UNKNOWN;
    if (!pref[k]) pref[k] = { artist: k, n: 0, plays: 0, likes: 0, skips: 0 };
    pref[k].n++;
    const l = djLearnGet(s.id);
    pref[k].plays += l.plays;
    pref[k].likes += l.liked ? 1 : 0;
    pref[k].skips += l.skips;
    if (state.favs.has(s.id)) pref[k].likes++;
  }
  return pref;
}
function songRecScore(s, pref) {
  const l = djLearnGet(s.id);
  if (l.skips >= 3) return -Infinity;
  const p = pref[s.artist] || { n: 0, plays: 0, likes: 0, skips: 0 };
  const known = p.plays > 0 || p.likes > 0;
  let score = 0;
  score += Math.min(p.plays * 0.6, 6);      // artistas que você mais ouve
  score += Math.min(p.likes * 2.2, 8);      // artistas com favoritas
  score += (l.liked ? 6 : 0) + (state.favs.has(s.id) ? 5 : 0);
  score += Math.min(l.plays, 3) * 0.4;      // músicas que você repete
  score -= l.skips * 1.5;                   // as que você pula
  score += known ? 2 : 0.5;                 // descoberta de artistas novos (leve)
  return score;
}
function recReason(s, pref) {
  const l = djLearnGet(s.id);
  if (state.favs.has(s.id) || l.liked) return 'Você curtiu ♥';
  const p = pref[s.artist];
  if (p && p.plays > 0) return 'Do artista que você mais ouve';
  if (p && p.likes > 0) return 'Você favoritou músicas dele';
  return 'Descoberta nova ✨';
}
function recommendTop(n) {
  const pref = learnArtistPref();
  return state.songs
    .filter(s => !s.type || s.type !== 'video')
    .map(s => ({ song: s, score: songRecScore(s, pref) }))
    .filter(x => x.score !== -Infinity)
    .sort((a, b) => b.score - a.score)
    .slice(0, n)
    .map(x => ({ song: x.song, reason: recReason(x.song, pref) }));
}

  }
  if ('mediaSession' in navigator) {

        navigator.mediaSession.metadata = new MediaMetadata({
          title: s.title, artist: s.artist, album: s.album,

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const s = state.queue[state.queueIndex];
  if (!s) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.title, artist: s.artist, album: s.album,
      artwork: coverUrl(s) ? [{ src: coverUrl(s), sizes: '512x512' }] : []
    });
    navigator.mediaSession.setActionHandler('play', togglePlay);
    navigator.mediaSession.setActionHandler('pause', togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', next);
  } catch (e) {}
}

function rr(g, x, y, w, h, r) {

  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);

  g.bezierCurveTo(-0.38, 0.58, 0, 0.8, 0, 1);
  g.bezierCurveTo(0, 0.8, 0.38, 0.58, 0.38, 0.35);

        for (let i = 0; i < n; i++) {

          const v = active ? raw : 0.15 + 0.08 * Math.sin(i + t * 2);
          const x = (i + 0.5) * (cv.width / n);
          const size = cv.height * (0.22 + v * 0.62);

function installedVersion() {

function versionNewer(a, b) {
  const pa = String(a || '').split(/[.\-+]/).map((n) => parseInt(n, 10) || 0);
  const pb = String(b || '').split(/[.\-+]/).map((n) => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x > y;
  }
  return false;
}
async function loadApkInfo() {
  const parse = (t) => {
    const p = String(t).trim().split('|');
    return p.length >= 3 ? { build: p[0], ver: p[1], url: p[2] } : null;
  };
  try {
    const t = await (await fetch(VERSION_URL, { cache: 'no-store' })).text();
    const remote = parse(t);
    if (remote) { APK_INFO = remote; return APK_INFO; }
  } catch (e) {}
  try {
    const t = await (await fetch('./version')).text();
    const local = parse(t);
    if (local) APK_INFO = local;
  } catch (e) { APK_INFO.url = ''; }

}
function updateAvailable() {
  const inst = installedVersion();
  return !!(inst && APK_INFO && APK_INFO.ver && versionNewer(APK_INFO.ver, inst));
}
function downloadApk() {
  if (!APK_INFO.url) { toast('URL do APK indisponível.'); return; }
  if (window.TamiNative && TamiNative.installUpdate) { TamiNative.installUpdate(APK_INFO.url); return; }
  window.location.href = APK_INFO.url;
}

  closeModal();
}
function showUpdateDialog() {

async function pickMediaFolder() {
  if (!window.showDirectoryPicker) { toast('Pasta requer Chrome/Edge no Windows'); return null; }
  const dir = await window.showDirectoryPicker({ mode: 'read' });
  const files = [];
  async function walk(d) {
    for await (const [name, h] of d.entries()) {
      if (h.kind === 'file' && /\.(mp3|m4a|flac|ogg|wav|aac|opus|mp4|mkv|webm|mov|avi)$/i.test(name)) {
        const f = await h.getFile();
        Object.defineProperty(f, 'name', { value: name, configurable: true });
        if (/\.(mp3|m4a|flac|ogg|wav|aac|opus)$/i.test(name)) files.push({ f, kind: 'song' });
        else files.push({ f, kind: 'video' });
      }
      if (h.kind === 'directory') await walk(h);
    }
  }
  await walk(dir);
  return {
    songs: files.filter((x) => x.kind === 'song').map((x) => x.f),
    vids: files.filter((x) => x.kind === 'video').map((x) => x.f)
  };
}

// ---------- Duplicadas ----------
function dupKey(s) {
  const t = String(s.title || s.name || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const a = String(s.artist || '').trim().toLowerCase();
  return (t || '?') + '|' + a;
}
function findDuplicates() {
  const groups = new Map();
  for (const s of state.songs) {
    const k = dupKey(s);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  }
  return [...groups.values()].filter((g) => g.length > 1);
}
async function removeDuplicates() {
  const groups = findDuplicates();
  const extras = groups.reduce((acc, g) => acc.concat(g.slice(1)), []);
  if (!extras.length) {
    djSpeak('Não encontrei músicas duplicadas. Tudo certo!');
    toast('Nenhuma duplicada encontrada 😊');
    return;
  }
  const list = $('modal');
  list.innerHTML = `<h3>Duplicadas (${extras.length})</h3>
    <div class="list" style="max-height:50vh;overflow-y:auto;padding:0">` +
    groups.map((g) => `<div class="section" style="padding:10px 8px 4px">${esc(g[0].title || g[0].name)} — ${esc(g[0].artist || '')}</div>` +
      g.slice(1).map((s) => `<div class="mrow" style="color:var(--text2)">🗑 ${esc(s.title || s.name)}</div>`).join('')).join('') +
    `</div>
    <div id="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn secondary" onclick="confirmByVoice()">🎙 Confirmar por voz</button>
      <button class="btn" onclick="deleteDupes()">Remover ${extras.length}</button>
    </div>`;
  $('modal-wrap').classList.add('show');
  djSpeak(`Encontrei ${extras.length} músicas duplicadas. Toque em remover, ou confirme por voz dizendo sim.`);
}
function confirmByVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voz não suportada — toque em "Remover".'); return; }
  const ids = [];
  for (const g of findDuplicates()) ids.push(...g.slice(1).map((s) => s.id));
  if (!ids.length) { toast('Nada a remover'); return; }
  djSpeak('Quer que eu remova as duplicadas? Diga sim, ou diga não.');
  const r = new SR();
  r.lang = 'pt-BR'; r.continuous = false; r.interimResults = false; r.maxAlternatives = 3;
  let done = false;
  const finish = () => { done = true; try { r.stop(); } catch (e) {} r.onresult = r.onerror = r.onend = null; };
  r.onresult = (ev) => {
    const t = djNorm((ev.results[ev.results.length - 1][0] || {}).transcript || '');
    if (done) return;
    if (/^(sim|quero|pode|ok|claro|remove|apaga|confir)/.test(t)) { finish(); djSpeak('Perfeito! Removendo as duplicadas.'); deleteDupes(ids); }
    else if (/^(nao|cancela)/.test(t)) { finish(); djSpeak('Tudo bem, não removo nada.'); }
  };
  r.onerror = () => { if (!done) toast('Não consegui ouvir — toque em "Remover".'); };
  r.onend = () => { if (!done) { try { r.start(); } catch (e) { finish(); } } };
  try { r.start(); } catch (e) { toast('Não consegui ouvir — toque em "Remover".'); }
}
async function deleteDupes(idsArg) {
  let ids = idsArg;
  if (!ids) {
    ids = [];
    for (const g of findDuplicates()) ids.push(...g.slice(1).map((s) => s.id));
  }
  if (!ids.length) return;
  closeModal();
  for (const id of ids) {
    await delObj('songs', id);
    state.favs.delete(id);
    if (state.learn[id]) { delete state.learn[id]; }
    if (objectUrlCache.has(id)) { URL.revokeObjectURL(objectUrlCache.get(id)); objectUrlCache.delete(id); }
    revokeCover(id);
    for (const p of state.playlists) {
      if (p.songIds && p.songIds.includes(id)) { p.songIds = p.songIds.filter((x) => x !== id); await putPlaylist(p); }
    }
  }
  await putKV('favs', [...state.favs]);
  if (Object.keys(state.learn).length) await putKV('learn', state.learn);
  state.queue = state.queue.filter((x) => !ids.includes(x.id));
  await reloadAll();
  toast('Duplicadas removidas!');
}

  await delObj('songs', id);
  state.favs.delete(id);

  if (objectUrlCache.has(id)) { URL.revokeObjectURL(objectUrlCache.get(id)); objectUrlCache.delete(id); }
  revokeCover(id);
  for (const p of state.playlists) {
    if (p.songIds && p.songIds.includes(id)) { p.songIds = p.songIds.filter((x) => x !== id); await putPlaylist(p); }

      <div class="mrow" onclick="pickNovidades()"><span class="art grad-b">🔎</span><div class="mid"><div class="it-title">Buscar novidades na pasta</div><div class="it-sub">Reler a pasta e importar só o que é novo</div></div></div>
      <div class="mrow" onclick="checkNovidades()"><span class="art grad-e">✨</span><div class="mid"><div class="it-title">Buscar novidades de versão</div><div class="it-sub">Verifica atualização do app no GitHub</div></div></div>
      <div class="mrow" onclick="removeDuplicates()"><span class="art grad-a">♻</span><div class="mid"><div class="it-title">Remover músicas duplicadas</div><div class="it-sub">A TAMI encontra e remove repetidas</div></div></div>
      <div id="modal-actions"><button class="btn secondary" onclick="closeModal()">Fechar</button></div>`;
    $('modal-wrap').classList.add('show');
  };
  document.body.appendChild(fab);
}
init();
</script>
