<title>TAMI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script>
(function(){
  function show(msg){
    try{
      var d=document.createElement('div');
      d.setAttribute('id','boot-err');
      d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:9999;background:#7a0a0a;color:#fff;padding:8px 12px;font:11px monospace;white-space:pre-wrap;word-break:break-all';
      d.textContent=msg;
      (document.body||document.documentElement).appendChild(d);
    }catch(e){}
  }
  window.addEventListener('error',function(ev){
    show('TAMI erro: '+(ev.message||'?')+(ev.filename?(' @ '+(ev.filename.split('/').pop())+' '+(ev.lineno||'?')+':'+(ev.colno||'?')):''));
  });
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev.reason;
    if (!r) return;
    var name=r.name||'';
    var msg=(r.message!=null)?''+r.message:(typeof r==='string'?r:String(r));
    if (/NotSupportedError|AbortError|InvalidStateError|EncodingError/i.test(name)) return;
    if (/has no supported source|no supported sources|not supported|cannot play|no hay fuentes|sem origens|origens suportadas|fuentes soportadas|não é possível reproduzir|de reprodução não suportado/i.test(msg)) return;
    show('TAMI promessa: '+msg);
  });
  window.addEventListener('DOMContentLoaded',function(){
    setTimeout(function(){
      try{ if(window.__tamiBooted) return; show('TAMI: app nao terminou de carregar. WebView: '+(navigator.userAgent||'?')); }catch(e){}
    },8000);
  });
})();
</script>
<style>
:root {
  --bg: #0B0F2A;
  --surface: rgba(20,26,58,.55);
  --surface-v: rgba(28,35,74,.35);
  --surface-solid: #141A3A;
  --primary: #00E5FF;
  --primary-dark: #0088CC;
  --secondary: #FF2FD6;
  --tertiary: #B388FF;
  --text: #EAF6FF;
  --text2: #9DB4D5;
  --divider: rgba(0,229,255,.14);
  --glass-b: rgba(255,255,255,.06);
  --glow: 0 0 14px rgba(0,229,255,.55);
  --glow-soft: 0 0 8px rgba(0,229,255,.28);
  --blur: blur(18px) saturate(130%);
  --bg-glow1: rgba(0,229,255,.16);
  --bg-glow2: rgba(255,47,214,.15);
  --bg-glow3: rgba(179,136,255,.14);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; overscroll-behavior-x: none; }
body {
  background:
    radial-gradient(1200px 600px at 12% -8%, var(--bg-glow1), transparent 60%),
    radial-gradient(1100px 700px at 108% 16%, var(--bg-glow2), transparent 60%),
    radial-gradient(900px 620px at 48% 108%, var(--bg-glow3), transparent 62%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
#bg-anim {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(1200px 600px at 80% -10%, rgba(124,77,255,.18), transparent 60%),
              radial-gradient(900px 500px at 10% 110%, rgba(179,136,255,.10), transparent 60%);
}
#app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

/* Toolbar */
header {
  display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 8px;
  min-height: 56px;
}
#back { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 4px 10px; display: none; }
#back.show { display: block; }
#title { flex: 1; font-size: 20px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#profile-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #1A0B2E; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; cursor: pointer; user-select: none;
}
.tbtn {
  background: none; border: none; color: var(--text2); font-size: 20px;
  cursor: pointer; padding: 8px; border-radius: 50%; line-height: 1;
}
.tbtn:hover { color: var(--text); background: var(--surface-v); }

/* Tabs */
main { flex: 1; overflow-y: auto; padding-bottom: 8px; overscroll-behavior-y: contain; touch-action: pan-y pinch-zoom; }
input[type="range"] { touch-action: none; }
.tab { display: none; }
.tab.active { display: block; }

/* Lists */
.list { padding: 4px 8px 16px; }
#search-wrap { padding: 0 12px 6px; position: sticky; top: 0; z-index: 9; background: var(--bg); }
#search { width: 100%; background: var(--surface); border: 1px solid var(--divider); color: var(--text); border-radius: 22px; padding: 10px 16px; font-size: 15px; outline: none; }
#search:focus { border-color: var(--primary); }
.p-vol { display: flex; align-items: center; gap: 10px; padding: 0 24px 18px; }
.p-vol .pl { color: var(--text2); font-size: 16px; }
.p-vol .pr { color: var(--primary); font-size: 13px; font-weight: 700; cursor: pointer; min-width: 34px; text-align: right; user-select: none; }
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 8px; border-radius: 12px; cursor: pointer;
}
.item:hover { background: var(--surface); }
#amb-list .item.active { background: var(--surface-v); border: 1px solid var(--divider); }
.art {
  width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff; font-size: 18px; overflow: hidden;
}
.art img { width: 100%; height: 100%; object-fit: cover; }
.art.small { width: 42px; height: 42px; font-size: 15px; }
.it-title { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it-sub { font-size: 12.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.mid { flex: 1; min-width: 0; }
.like {
  background: none; border: none; color: var(--text2); font-size: 20px;
  cursor: pointer; padding: 6px; line-height: 1;
}
.like.fav { color: var(--primary); }

/* Section headers */
.section {
  display: flex; align-items: center; gap: 8px;
  padding: 16px 16px 6px; color: var(--text2);
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
}

/* Empty state */
.empty { text-align: center; color: var(--text2); padding: 48px 24px; line-height: 1.6; }
.empty .big { font-size: 44px; margin-bottom: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--primary-dark); color: #fff; border: none;
  border-radius: 24px; padding: 12px 22px; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 14px;
}
.btn.secondary { background: var(--surface-v); color: var(--text); }

/* Bottom nav */
nav {
  display: flex; overflow-x: auto; justify-content: flex-start;
  -webkit-overflow-scrolling: touch; touch-action: pan-x;
  scroll-snap-type: x proximity;
  background: var(--surface); border-top: 1px solid var(--divider);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: 0 0 auto; min-width: 72px; background: none; border: none; color: var(--text2);
  font-size: 11px; padding: 8px 6px 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  scroll-snap-align: center;
}
nav button .ic { font-size: 20px; line-height: 1; }
nav button.active { color: var(--primary); }

/* Mini player */
#mini {
  display: none; align-items: center; gap: 10px;
  background: var(--surface); border-top: 1px solid var(--divider);
  padding: 8px 12px; cursor: pointer;
}
#mini.show { display: flex; }
.mm { color: var(--text2); background: none; border: none; font-size: 22px; cursor: pointer; padding: 6px; line-height: 1; }
.mm.primary { color: var(--primary); }

/* Player overlay */
#player {
  position: fixed; inset: 0; z-index: 20;
  background: linear-gradient(160deg, #1A0B2E 0%, #121212 55%);
  display: none; flex-direction: column;
}
#player.show { display: flex; }
.p-top { display: flex; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 0; }
.p-top button { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 10px; }
.p-top span { flex: 1; text-align: center; font-size: 14px; color: var(--text2); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.p-art {
  width: min(72vw, 320px); aspect-ratio: 1; margin: 6vh auto 0;
  border-radius: 18px; overflow: hidden;
  background: var(--surface-v);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 18px 50px rgba(124,77,255,.3);
}
.p-art img, .p-art video { width: 100%; height: 100%; object-fit: cover; }
.p-art .ph { font-size: 90px; font-weight: 800; color: var(--primary); }
.p-info { padding: 28px 24px 8px; }
.p-title { font-size: 21px; font-weight: 700; text-align: center; }
.p-sub { font-size: 14px; color: var(--text2); text-align: center; margin-top: 6px; }
.p-seek { padding: 8px 22px 0; }
.p-vis { padding: 6px 24px 0; position: relative; }
.vis-btn { position: absolute; right: 26px; top: 8px; background: rgba(20,26,58,.45); border: 1px solid var(--divider); color: var(--primary); font-size: 13px; cursor: pointer; padding: 2px 8px; border-radius: 10px; line-height: 1.4; }
.vis-btn:hover { border-color: var(--primary); }
#vis { width: 100%; height: 46px; display: block; opacity: .85; filter: drop-shadow(0 0 10px rgba(0,229,255,.25)); }
.p-time { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text2); padding: 4px 2px 0; }
input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: var(--surface-v); outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--primary); cursor: pointer; border: none; }
.p-controls { display: flex; align-items: center; justify-content: flex-start; gap: 12px; padding: 16px 14px 26px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.p-controls::-webkit-scrollbar { display: none; width: 0; height: 0; }
.pc {
  background: none; border: none; color: var(--text); font-size: 24px;
  cursor: pointer; padding: 8px; line-height: 1; width: 46px; height: 46px;
  flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
}
.pc.primary { color: var(--primary); }
.pc.big { font-size: 44px; width: 74px; height: 74px; }

/* Dialogs */
#modal-wrap { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; }
#modal-wrap.show { display: flex; }
#modal {
  width: 100%; max-width: 480px; background: var(--surface);
  border-radius: 20px 20px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);
}
#modal h3 { margin: 0 0 12px; font-size: 17px; }
#modal input[type=text] {
  width: 100%; background: var(--surface-v); border: 1px solid var(--divider);
  color: var(--text); border-radius: 10px; padding: 12px; font-size: 15px; outline: none;
}
#modal .mrow {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px;
  border-bottom: 1px solid var(--divider); cursor: pointer;
}
#modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }

/* misc */
html.light {
  --bg: #F5F3FA; --surface: #FFFFFF; --surface-v: #EDEAF5;
  --primary: #7C4DFF; --primary-dark: #5E35B1;
  --text: #1C1A23; --text2: #6E6A7A; --divider: #E3E0EC;
  --bg-glow1: rgba(124,77,255,.10);
  --bg-glow2: rgba(255,47,214,.08);
  --bg-glow3: rgba(0,229,255,.07);
}
html.light #player { background: linear-gradient(160deg, #EFEAFA 0%, #F5F3FA 55%); }
html.light .p-art { box-shadow: 0 18px 50px rgba(124,77,255,.18); }
html.light #drop-overlay { background: rgba(124,77,255,.15); color: var(--primary-dark); }
html[data-accent="roxo"] { --primary:#B388FF; --primary-dark:#7C4DFF; --secondary:#FF2FD6; --tertiary:#00E5FF; --divider:rgba(179,136,255,.14); --glow:0 0 14px rgba(179,136,255,.55); --glow-soft:0 0 8px rgba(179,136,255,.28); --bg-glow1:rgba(179,136,255,.18); --bg-glow2:rgba(255,47,214,.12); --bg-glow3:rgba(0,229,255,.10); }
html[data-accent="rosa"] { --primary:#FF6EC7; --primary-dark:#E0509F; --secondary:#FFD166; --tertiary:#B388FF; --divider:rgba(255,110,199,.14); --glow:0 0 14px rgba(255,110,199,.55); --glow-soft:0 0 8px rgba(255,110,199,.28); --bg-glow1:rgba(255,110,199,.20); --bg-glow2:rgba(179,136,255,.13); --bg-glow3:rgba(255,209,102,.10); }
html[data-accent="azul"] { --primary:#54A0FF; --primary-dark:#2E86DE; --secondary:#00E5FF; --tertiary:#B388FF; --divider:rgba(84,160,255,.14); --glow:0 0 14px rgba(84,160,255,.55); --glow-soft:0 0 8px rgba(84,160,255,.28); --bg-glow1:rgba(84,160,255,.18); --bg-glow2:rgba(0,229,255,.12); --bg-glow3:rgba(179,136,255,.10); }
html[data-accent="verde"] { --primary:#5CD859; --primary-dark:#26A65A; --secondary:#FFD166; --tertiary:#00E5FF; --divider:rgba(92,216,89,.14); --glow:0 0 14px rgba(92,216,89,.55); --glow-soft:0 0 8px rgba(92,216,89,.28); --bg-glow1:rgba(92,216,89,.16); --bg-glow2:rgba(0,229,255,.10); --bg-glow3:rgba(255,209,102,.08); }
html[data-accent="laranja"] { --primary:#FF9F43; --primary-dark:#EE812B; --secondary:#FFD166; --tertiary:#FF2FD6; --divider:rgba(255,159,67,.14); --glow:0 0 14px rgba(255,159,67,.55); --glow-soft:0 0 8px rgba(255,159,67,.28); --bg-glow1:rgba(255,159,67,.18); --bg-glow2:rgba(255,47,214,.10); --bg-glow3:rgba(255,209,102,.10); }
html[data-accent="roxo"].light { --primary:#7C4DFF; --primary-dark:#5E35B1; }

html[data-accent="laranja"].light { --primary:#EE812B; --primary-dark:#CD6B1E; }
#drop-overlay {
  position: fixed; inset: 0; z-index: 50; display: none;
  align-items: center; justify-content: center; text-align: center;
  background: rgba(124,77,255,.22); border: 3px dashed var(--primary);
  color: #fff; font-size: 18px; font-weight: 600; pointer-events: none;
}
#drop-overlay.show { display: flex; }
.hidden { display: none !important; }
.toast {
  position: fixed; z-index: 40; bottom: 96px; left: 50%; transform: translateX(-50%);
  background: var(--surface-v); color: var(--text); padding: 12px 20px;
  border-radius: 24px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
  opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 86vw; text-align: center;
}
.toast.show { opacity: 1; }
.grad-a { background: linear-gradient(135deg,#FF6B8A,#C44569); }
.grad-b { background: linear-gradient(135deg,#54A0FF,#2E86DE); }
.grad-c { background: linear-gradient(135deg,#5CD859,#26A65A); }
.grad-d { background: linear-gradient(135deg,#FFA502,#E67E22); }
.grad-e { background: linear-gradient(135deg,#B388FF,#7C4DFF); }
.v-hero { text-align: center; padding: 26px 16px 8px; }
.v-logo { font-size: 72px; line-height: 1; filter: drop-shadow(0 8px 22px rgba(255,110,199,.4)); }
.v-avatar {
  width: 108px; height: 108px; margin: 0 auto; position: relative; cursor: pointer;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 28%, #FFE3F2, #FF8AD0 48%, #B388FF 100%);
  box-shadow: 0 0 34px rgba(255,110,199,.55), inset 0 -10px 20px rgba(124,77,255,.35), inset 0 6px 12px rgba(255,255,255,.5);
  animation: tami-bob 3.2s ease-in-out infinite;
  transition: transform .2s;
}
.v-avatar:active { transform: scale(.95); }
.v-avatar .v-bow { position: absolute; top: -8px; right: 4px; font-size: 30px; filter: drop-shadow(0 3px 6px rgba(255,110,199,.6)); transform: rotate(12deg); }
.v-avatar .face { position: absolute; inset: 0; }
.v-avatar .eye {
  position: absolute; top: 42%; width: 13px; height: 16px; border-radius: 50%;
  background: #33113A; animation: tami-blink 4.2s infinite;
}
.v-avatar .eye.l { left: 28%; } .v-avatar .eye.r { right: 28%; animation-delay: .06s; }
.v-avatar .eye::after { content: ''; position: absolute; top: 3px; left: 4px; width: 5px; height: 5px; border-radius: 50%; background: #fff; opacity: .95; }
.v-avatar .blush { position: absolute; top: 58%; width: 18px; height: 10px; border-radius: 50%; background: rgba(255,55,140,.55); filter: blur(1.5px); }
.v-avatar .blush.l { left: 16%; } .v-avatar .blush.r { right: 16%; }
.v-avatar .mouth {
  position: absolute; left: 50%; top: 60%; width: 20px; height: 9px;
  transform: translateX(-50%); border-bottom: 3px solid #33113A;
  border-radius: 0 0 14px 14px;
}
.v-avatar.playing { animation: tami-dance .55s ease-in-out infinite; }
.v-avatar.playing .mouth { height: 14px; border-radius: 0 0 16px 16px; }
.v-avatar.sleep { animation: tami-bob 4.6s ease-in-out infinite; filter: saturate(.65); }
.v-avatar.sleep .eye { animation: none; height: 3px; border-radius: 2px; }
.v-avatar.sleep .eye::after { display: none; }
@keyframes tami-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes tami-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes tami-dance { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
.v-name { font-size: 30px; font-weight: 800; margin-top: 8px; background: linear-gradient(90deg,#FF6EC7,#B388FF); -webkit-background-clip: text; background-clip: text; color: transparent; }

<style id="redesign-futuro">
/* Futurista sci-fi: fundo em grade neon animado + glassmorphism neon em todos os painéis Virgin Virgin */
:root {
  --redesign-glow: #00E5FF;
  --redesign-glow2: #FF2FD6;

// ---------- IndexedDB ----------
function openDB() {
  return new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open('tami-app', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('songs')) db.createObjectStore('songs', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('playlists')) db.createObjectStore('playlists', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('blocked'));
    } catch (e) { reject(e); }
  });
}
async function ensureDB() {
  if (state.db) return state.db;
  for (let i = 0; i < 3; i++) {
    try {
      const db = await Promise.race([
        openDB(),
        new Promise((r) => setTimeout(() => r(null), 8000))

      if (db) { state.db = db; return db; }
    } catch (e) {}
    await new Promise((r) => setTimeout(r, 1500));
  }
  return state.db;
}

}

// ---------- Leitura de metadados (ID3) ----------
function readHead(file, size) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(new Uint8Array(fr.result));
    fr.onerror = () => rej(fr.error);
    fr.readAsArrayBuffer(file.slice(0, Math.min(size, file.size)));

}
function tv4size(b, at) { return ((b[at] & 0x7f) << 21) | ((b[at + 1] & 0x7f) << 14) | ((b[at + 2] & 0x7f) << 7) | (b[at + 3] & 0x7f); }
function tv3size(b, at) { return ((b[at] & 0xff) << 24) | ((b[at + 1] & 0xff) << 16) | ((b[at + 2] & 0xff) << 8) | (b[at + 3] & 0xff); }
function decodeText(enc, bytes) {
  try {
    if (enc === 3) return new TextDecoder('utf-8').decode(bytes);
    if (enc === 0) return new TextDecoder('latin1').decode(bytes);
    if (enc === 2) return new TextDecoder('utf-16be').decode(bytes);
    let s = new TextDecoder('utf-16le').decode(bytes);
    s = s.replace(/^\uFEFF/, '');
    return s;
  } catch (e) { return ''; }
}
function stripNull(s) { return String(s).replace(/\u0000/g, '').trim(); }
function parseId3(file, bytes) {
  const meta = { title: '', artist: '', album: '', year: '', cover: null, index: null };
  if (bytes.length < 10 || bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x53) return meta;
  const ver = bytes[3];
  let size;
  if (ver === 2) {
    size = tv4size(bytes, 6);
    let pos = 10, end = Math.min(10 + size, bytes.length);
    while (pos + 6 <= end) {
      const id = String.fromCharCode(bytes[pos], bytes[pos + 1], bytes[pos + 2]);
      const fsize = tv3size(bytes, pos + 3);
      const data = bytes.slice(pos + 6, pos + 6 + fsize);
      applyFrame(meta, id, data, 2);
      pos += 6 + fsize;
    }
  } else {
    size = tv4size(bytes, 6);
    const flags = bytes[5];
    let pos = 10;
    if (flags & 0x40) pos += tv4size(bytes, 10); // ext header
    let end = Math.min(10 + size, bytes.length);
    while (pos + 10 <= end) {
      const id = String.fromCharCode(bytes[pos], bytes[pos + 1], bytes[pos + 2], bytes[pos + 3]);
      if (!id.replace(/\0/g, '')) break;
      const fsize = ver === 4 ? tv4size(bytes, pos + 4) : tv3size(bytes, pos + 4);
      const data = bytes.slice(pos + 10, pos + 10 + fsize);
      applyFrame(meta, id, data, ver);
      pos += 10 + fsize;
    }
  }
  return meta;
}
function applyFrame(meta, id, data, ver) {
  const textLens = ['TIT2', 'TPE1', 'TALB', 'TYER', 'TCON'];
  const q = { TT2: 'TIT2', TP1: 'TPE1', TAL: 'TALB', TYE: 'TYER', TCO: 'TCON' };
  const real = q[id] || id;
  if (textLens.includes(real)) {
    if (data.length < 2) return;
    const enc = data[0];
    let text = decodeText(enc, data.slice(1));
    if (enc === 1) {
      text = text.replace(/\u0000+$/, '');
      if (!text && data.length > 3) text = decodeText(enc, data.slice(4)).replace(/\u0000+$/, '');
    }
    text = stripNull(text);
    if (real === 'TIT2') meta.title = text;
    else if (real === 'TPE1') meta.artist = text;
    else if (real === 'TALB') meta.album = text;
    else if (real === 'TYER') meta.year = text;
  } else if (id === 'APIC') {
    if (data.length < 6) return;
    const enc = data[0];
    function nullEnd(start) {
      if (enc === 1 || enc === 2) {
        for (let i = start; i + 1 < data.length; i++) if (data[i] === 0 && data[i + 1] === 0) return i;
        return data.length;
      }
      for (let i = start; i < data.length; i++) if (data[i] === 0) return i;
      return data.length;
    }
    const mimeEnd = nullEnd(1);
    const mime = String.fromCharCode.apply(null, Array.from(data.slice(1, mimeEnd)));
    let p = mimeEnd + 1;
    const typeByte = data[p]; p++;
    p = nullEnd(p) + (enc === 1 || enc === 2 ? 2 : 1);
    const img = data.slice(p);
    if (img.length > 100) {
      meta.cover = { mime: mime || 'image/jpeg', blob: new Blob([img], { type: mime || 'image/jpeg' }) };
    }

  }
}

}

    el.onerror = () => { resolve(0); URL.revokeObjectURL(url); };

function fileReaderB64(blob) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || '').split(',')[1] || '');
    r.onerror = () => res('');

  });

async function cacheHandoffPath(file, id) {

    if (!(window.TamiNative && window.TamiNative.cacheStart && window.TamiNative.cacheAppend)) return '';
    if (!file || !file.size) return '';
    const base = (file.name || 'music').replace(/[^A-Za-z0-9._ -]/g, '_');
    const path = window.TamiNative.cacheStart(base + '-' + String(id).replace(/[^A-Za-z0-9_-]/g, ''));
    if (!path) return '';
    const CH = 512 * 1024;
    for (let off = 0; off < file.size; off += CH) {
      const slice = file.slice(off, off + CH);
      const b64 = await fileReaderB64(slice);
      if (!b64 || !window.TamiNative.cacheAppend(path, b64)) return '';
    }
    return path;
  } catch (e) { return ''; }
}

}

async function ensureHandoffPath(s) {
  try {
    if (!s || s.handoffPath || s.type === 'video') return;
    if (!(window.TamiNative && window.TamiNative.cacheStart && window.TamiNative.cacheAppend)) return;
    if (!s.blob || !s.blob.size || handoffBusy.has(s.id)) return;
    handoffBusy.add(s.id);
    try {
      const base = (s.name || s.title || 'music').replace(/[^A-Za-z0-9._ -]/g, '_');
      const path = window.TamiNative.cacheStart(base + '-' + String(s.id).replace(/[^A-Za-z0-9_-]/g, ''));
      if (!path) return;
      const CH = 512 * 1024;
      for (let off = 0; off < s.blob.size; off += CH) {
        const b64 = await fileReaderB64(s.blob.slice(off, off + CH));
        if (!b64 || !window.TamiNative.cacheAppend(path, b64)) return;
      }

      try { await putSong(s); } catch (e) {}

      handoffBusy.delete(s.id);
    }
  } catch (e) {}
}
async function importFiles(fileList, kind) {
  const existing = new Set();
  const seeds = kind === 'song' ? state.songs : state.videos;
  for (const it of seeds) {
    const b = it.blob || {};
    existing.add((b.lastModified || it.createdAt || 0) + '|' + (b.size || it.sizeBytes || 0) + '|' + it.name);
  }
  let added = 0, skipped = 0;
  toast(`Importando ${fileList.length} arquivos…`);
  if (!(await ensureDB())) { toast('Armazenamento indisponível: não é possível importar músicas.'); return; }
  for (const file of fileList) {
    const key = (file.lastModified || 0) + '|' + file.size + '|' + file.name;
    if (existing.has(key)) { skipped++; continue; }
    existing.add(key);
    try {
      if (kind === 'song') {
        const meta = await metadataOf(file);
        const dur = await durationOf(file, false);
        const id = 's' + (file.lastModified) + '-' + Math.random().toString(36).slice(2, 8);
        const handoffPath = await cacheHandoffPath(file, id);
        await putSong({
          id: id,
          title: meta.title || file.name, artist: meta.artist || 'Artista desconhecido',
          album: meta.album || UNKNOWN, year: meta.year || (new Date().getFullYear()),
          durationMs: dur, cover: meta.cover ? meta.cover.blob : null,
          coverMime: meta.cover ? meta.cover.mime : null,
          type: 'song', createdAt: Date.now(), blob: file, name: file.name, handoffPath

      } else {
        const dur = await durationOf(file, true);
        await putVideo({
          id: 'v' + Math.random().toString(36).slice(2, 10),
          title: file.name.replace(/\.[^.]+$/, '').trim(), durationMs: dur,
          sizeBytes: file.size, type: 'video', blob: file, name: file.name, createdAt: Date.now()
        });
      }
      added++;
    } catch (e) { console.warn('falha ao importar', file.name, e); }
  }
  await reloadAll();
  toast(`Importadas ${added} ${kind === 'song' ? 'músicas' : 'vídeos'}${skipped ? ` (${skipped} duplicada${skipped === 1 ? '' : 's'} ignorada${skipped === 1 ? '' : 's'})` : ''}.`);
  if (added && kind === 'song') buildAlbums();
}

function buildAlbums() {

// ---------- Som de fundo (ambiente) ----------
let ambCtx = null, ambBus = null, ambNodes = [];
const AMBIENT_SOUNDS = [
  { id: 'chuva', icon: '🌧️', name: 'Chuva', sub: 'Chuva constante e calma' },
  { id: 'mar', icon: '🌊', name: 'Mar', sub: 'Ondas do oceano' },
  { id: 'vento', icon: '🌬️', name: 'Vento', sub: 'Brisa e ventania' },
  { id: 'fogo', icon: '🔥', name: 'Fogueira', sub: 'Crepitar de brasas' },
  { id: 'grilos', icon: '🌙', name: 'Noite', sub: 'Grilos e silêncio' },
  { id: 'riacho', icon: '🏞️', name: 'Riacho', sub: 'Água corrente' },
  { id: 'branco', icon: '⬜', name: 'Ruído branco', sub: 'Foco e concentração' },
  { id: 'rosa', icon: '🌸', name: 'Ruído rosa', sub: 'Som suave e acolhedor' }
];
function ambNoise(type) {
  const rate = ambCtx.sampleRate;
  const buf = ambCtx.createBuffer(1, rate * 4, rate);
  const ch = buf.getChannelData(0);
  if (type === 'white') {
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  } else if (type === 'pink') {
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < ch.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      ch[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
  } else {
    let last = 0;
    for (let i = 0; i < ch.length; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      ch[i] = last * 3.5;
    }
  }
  const src = ambCtx.createBufferSource();
  src.buffer = buf; src.loop = true;
  return src;
}
function ambLfo(freq, depth, target, base) {
  const osc = ambCtx.createOscillator();
  osc.frequency.value = freq;
  const lg = ambCtx.createGain();
  lg.gain.value = depth;
  const g = ambCtx.createGain();
  g.gain.value = base;
  osc.connect(lg).connect(g.gain);
  g.connect(target);
  osc.start();
  return osc;
}
function ambBuilder(id) {
  const ctx = ambCtx;
  const g = ctx.createGain(); g.gain.value = 1;
  const out = ctx.createGain();
  const st = { stop: [] };
  switch (id) {
    case 'chuva': {
      const src = ambNoise('white');
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 260;
      src.connect(lp); lp.connect(hp); hp.connect(g);
      const lfo = ambLfo(5, 0.12, g.gain, 0.45);
      st.stop.push(src, lfo);
      break;
    }
    case 'mar': {
      const src = ambNoise('brown');
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 320; bp.Q.value = 0.55;
      src.connect(bp); bp.connect(g);
      const lfo = ambLfo(0.07, 0.42, g.gain, 0.5);
      st.stop.push(src, lfo);
      break;
    }
    case 'vento': {
      const src = ambNoise('pink');
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.35;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
      src.connect(bp); bp.connect(hp); hp.connect(g);
      const lfo = ambLfo(0.1, 0.16, g.gain, 0.4);
      st.stop.push(src, lfo);
      break;
    }
    case 'fogo': {
      const src = ambNoise('brown');
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 950;
      src.connect(lp); lp.connect(g);
      const lfo = ambLfo(0.7, 0.22, g.gain, 0.55);
      const crackle = ctx.createBufferSource();
      crackle.buffer = ambNoise('white').buffer;
      crackle.loop = true;
      const cbp = ctx.createBiquadFilter(); cbp.type = 'bandpass'; cbp.frequency.value = 2400; cbp.Q.value = 2;
      const cg = ctx.createGain(); cg.gain.value = 0;
      crackle.connect(cbp); cbp.connect(cg); cg.connect(g);
      const timer = setInterval(() => {
        if (Math.random() < 0.5) {
          const t = ctx.currentTime;
          cg.gain.cancelScheduledValues(t);
          cg.gain.setValueAtTime(0.02 + Math.random() * 0.25, t);
          cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.05 + Math.random() * 0.12);
        }
      }, 90);
      st.stop.push(src, lfo, crackle);
      st.timer = timer;
      break;
    }
    case 'grilos': {
      for (const f of [4300, 4600, 5000]) {
        const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f;
        const og = ctx.createGain(); og.gain.value = 0;
        const flfo = ctx.createOscillator(); flfo.frequency.value = 3 + Math.random() * 2;
        const flg = ctx.createGain(); flg.gain.value = 70;
        flfo.connect(flg).connect(osc.frequency);
        const glfo = ctx.createOscillator(); glfo.frequency.value = 2 + Math.random() * 0.6;
        const glg = ctx.createGain(); glg.gain.value = 0.2;
        glfo.connect(glg).connect(og.gain);
        osc.connect(og); og.connect(g);
        osc.start(); flfo.start(); glfo.start();
        st.stop.push(osc, flfo, glfo);
      }
      break;
    }
    case 'riacho': {
      const src = ambNoise('pink');
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 620; lp.Q.value = 0.3;
      src.connect(lp); lp.connect(g);
      const src2 = ambNoise('pink');
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 1.6;
      const g2 = ctx.createGain(); g2.gain.value = 0.25;
      src2.connect(bp); bp.connect(g2); g2.connect(g);
      const lfo = ambLfo(0.35, 0.12, g2.gain, 0.25);
      const lfo2 = ambLfo(0.9, 0.15, bp.frequency, 1700);
      st.stop.push(src, src2, lfo, lfo2);
      break;
    }
    case 'branco': {
      const src = ambNoise('white');
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200;
      src.connect(lp); lp.connect(g);
      g.gain.value = 0.5;
      st.stop.push(src);
      break;
    }
    case 'rosa': {
      const src = ambNoise('pink');
      src.connect(g);
      g.gain.value = 0.5;
      st.stop.push(src);
      break;
    }
  }
  g.connect(out); out.connect(ambBus);
  st.start = () => { for (const n of st.stop) { if (n.start) { try { n.start(); } catch (e) {} } } };
  st.stopAll = () => {
    if (st.timer) clearInterval(st.timer);
    for (const n of st.stop) {
      if (n.stop) { try { n.stop(); } catch (e) {} }
      try { n.disconnect(); } catch (e) {}
    }
    try { g.disconnect(); out.disconnect(); } catch (e) {}
  };
  return st;
}
function ensureAmbCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { toast('Áudio não suportado neste navegador.'); return false; }
  if (!ambCtx) {
    ambCtx = new AC();
    ambBus = ambCtx.createGain();
    ambBus.gain.value = state.amb.vol;
    ambBus.connect(ambCtx.destination);
  }
  if (ambCtx.state === 'suspended') ambCtx.resume().catch(() => {});

}
function ambStop() {
  for (const n of ambNodes) { try { n.stopAll(); } catch (e) {} }
  ambNodes = [];
  state.amb.playing = false;
}
function ambToggle(id) {
  if (!id || !AMBIENT_SOUNDS.some((s) => s.id === id)) return;
  if (state.amb.id === id && state.amb.playing) {
    ambStop();
    state.amb.id = null;
  } else {
    if (!ensureAmbCtx()) return;
    ambStop();
    state.amb.id = id;
    const b = ambBuilder(id);
    ambNodes = [b];
    b.start();
    state.amb.playing = true;

}

let objectUrlCache = new Map();
let coverUrlCache = new Map();
function objUrl(s) {
  if (!s.blob) return s.url || '';
  if (!objectUrlCache.has(s.id)) objectUrlCache.set(s.id, URL.createObjectURL(s.blob));
  return objectUrlCache.get(s.id);
}
function codecNeeded(s) {
  if (!s || s.blob || s.type === 'video') return false;
  if (!s.url || !/^(content|file):/.test(s.url)) return false;
  if (!window.TamiNative || !window.TamiNative.mediaInfo) return false;
  let info = s.__codec;
  if (!info) {
    try { info = JSON.parse(String(window.TamiNative.mediaInfo(s.url))); } catch (e) { info = null; }
    if (info) s.__codec = info;
  }
  if (!info) return false;
  const m = String(info.m || '');
  const c = String(info.c || '');
  return /wma|amr|ape|wavpack|ac-3|ec-3|alac|\.ape/i.test(m + ' ' + c);
}
let codecTimer = 0;
function startCodecTick() { clearInterval(codecTimer); codecTimer = setInterval(codecTickRender, 250); }
function stopCodecTick() { clearInterval(codecTimer); codecTimer = 0; }
function codecTickRender() {
  if (!state.codec) { stopCodecTick(); return; }
  let o = null;
  try { o = JSON.parse(String(window.TamiNative.codecInfo() || '{}')); } catch (e) {}
  if (!o) return;
  const pos = (Number(o.pos) || 0) / 1000;
  const dur = (Number(o.dur) || 0) / 1000;
  const playing = !!o.playing;
  const seek = $('seek');
  if (seek) {
    seek.disabled = dur <= 0;
    seek.max = dur || 0;
    if (document.activeElement !== seek) seek.value = Math.min(pos, dur || pos);
  }
  if ($('time-cur')) $('time-cur').textContent = fmtTime(pos * 1000);
  if ($('time-dur')) $('time-dur').textContent = fmtTime(dur * 1000);
  if ($('p-play')) $('p-play').textContent = playing ? '⏸' : '▶';
  if ($('mini-play')) $('mini-play').textContent = playing ? '⏸' : '▶';
  state.codecPlaying = playing;
  syncNativeNow(false);
  lyrTick();
}
function codecEnded() {
  if (!state.codec) return;
  state.codec = null;
  state.codecPlaying = false;
  stopCodecTick();
  const s = state.current;
  if (state.repeat === 2) { if (s) nativeCodecStart(s); return; }
  if (state.repeat === 1 || state.queueIndex < state.queue.length - 1 || state.upNext.length) next();
  else { renderPlayer(); syncNativeNow(true); }
}
function nativeCodecStart(s) {
  audio.pause();
  try { audio.removeAttribute('src'); } catch (e) {}
  state.codec = s.id;
  try { window.TamiNative.codecPlay(s.url, s.title || s.name || '', s.artist || '', 0); } catch (e) {}
  if (state.djMode) {
    if (s.id !== djLastId) { djLearnSet(s.id, { plays: djLearnGet(s.id).plays + 1 }); djLastId = s.id; }
    if (djEntered) djEntered = false;
    else if (!djAnnounced.has(s.id)) { djAnnounced.add(s.id); djAnnounceTrack(s); }
  } else announceNowPlaying(s);
  updateMediaSession();
  startCodecTick();
}
function nativeCodecStop() {
  if (!state.codec) return;
  state.codec = null;
  state.codecPlaying = false;
  stopCodecTick();
  try { if (window.TamiNative && window.TamiNative.codecStop) window.TamiNative.codecStop(); } catch (e) {}
}

const lyr = { open: false, songId: null, songTitle: '', kind: 'none', lines: [], tr: new Map(), timer: 0, idx: -1, trOn: true };
const lyrBusy = new Set();
function parseLrc(raw) {
  const out = [];
  const re = /\[(\d{1,2}):(\d{1,2}(?:[.:]\d{1,3})?)\]/g;
  for (const line of String(raw).split(/\r?\n/)) {
    const times = [];
    let m;
    while ((m = re.exec(line))) times.push((+m[1]) * 60 + parseFloat(m[2].replace(',', '.')));
    if (!times.length) continue;
    const text = line.replace(re, '').trim();
    for (const t of times) out.push({ t, text });
  }
  return out.sort((a, b) => a.t - b.t);
}

async function translateText(text) {
  try {
    const q = encodeURIComponent(text);
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${lyrTrLang()}&dt=t&q=${q}`);
    if (!r.ok) return '';
    const j = await r.json();
    if (!j || !Array.isArray(j[0])) return '';
    return j[0].map((x) => (x && x[0]) || '').join('');
  } catch (e) { return ''; }
}
async function fetchLyrics(s) {
  const artist = (s.artist || s.album || '').trim();
  const title = (s.title || s.name || '').trim();
  if (!title) return null;
  try {
    const r = await fetch(
      `https://lrclib.net/api/search?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`
    );
    if (r.ok) {
      const arr = await r.json();
      if (Array.isArray(arr) && arr.length && arr[0]) {
        const it = arr[0];
        const syn = it.syncedLyrics || '';
        if (syn) {
          const lines = parseLrc(syn);
          if (lines.length) return { kind: 'lrc', lines };
        }
        const pl = String(it.plainLyrics || '').trim();
        if (pl) return { kind: 'text', lines: pl.split(/\r?\n/).map((x) => ({ t: 0, text: x.trim() })) };
      }
    }
  } catch (e) {}
  try {
    const r = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
    if (r.ok) {
      const j = await r.json();
      const ly = String((j && j.lyrics) || '').trim();
      if (ly) return { kind: 'text', lines: ly.split(/\r?\n/).map((x) => ({ t: 0, text: x.trim() })) };
    }
  } catch (e) {}
  return null;
}

function lyrTick() {
  if (!lyr.open) return;
  const cur = state.current;
  if (!cur) return;
  if (cur.id !== lyr.songId) {
    lyr.songId = cur.id;
    lyr.songTitle = cur.title || cur.name || '';
    lyr.tr = new Map();
    lyr.idx = -1;
    const st = $('lyr-status');
    if (st) st.textContent = L('lyrLoading');
    lsLoad(cur);
    return;
  }
  if (lyr.kind !== 'lrc' || !lyr.lines.length) return;
  let t = 0;
  if (state.codec) {
    let o = null;
    try { o = JSON.parse(String(window.TamiNative.codecInfo() || '{}')); } catch (e) {}
    if (o) t = (Number(o.pos) || 0) / 1000;
  } else {
    const el = cur.type === 'video' ? video : audio;
    t = (el && el.currentTime) || 0;
  }
  let i = -1;
  for (let k = 0; k < lyr.lines.length; k++) {
    if (lyr.lines[k].t <= t + 0.15) i = k; else break;
  }
  if (i === lyr.idx) return;
  if (i < 0) return;
  lyr.idx = i;
  const box = $('lyr-scroll');
  if (!box) return;
  const prev = box.querySelector('.lyr-now');
  if (prev) prev.classList.remove('lyr-now');
  const el = box.querySelector(`[data-i="${i}"]`);
  if (el) {
    el.classList.add('lyr-now');
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
    if (lyr.trOn) lyrTranslateNear(i);
  }
}
async function lyrTranslateOne(i) {
  const ln = lyr.lines[i];

}

function readSongChunk(url, start, len) {
  try {
    const chunk = window.TamiNative && window.TamiNative.readSong ? window.TamiNative.readSong(url, start, len) : '';
    if (!chunk) return null;
    const bin = atob(chunk);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  } catch (e) { console.warn('readSongChunk', e); return null; }
}
async function blobForSong(s) {
  if (!s || s.blob) return true;
  if (!s.url) return false;
  if (window.TamiNative && window.TamiNative.songSize) {
    try {
      const size = Number(window.TamiNative.songSize(s.url)) || 0;
      if (size <= 0) return false;
      const CH = 512 * 1024;
      let off = 0;
      const parts = [];
      while (off < size) {
        const data = readSongChunk(s.url, off, Math.min(CH, size - off));
        if (!data || !data.length) return false;
        parts.push(data);
        off += data.length;
      }
      s.blob = new Blob(parts, { type: '' });
      return true;
    } catch (e) { console.warn('native blob', e); }
  }
  try {
    const r = await fetch(s.url);
    if (!r.ok) return false;
    const b = await r.blob();
    if (!b || !b.size) return false;
    s.blob = b;
    return true;
  } catch (e) { console.warn('fetch blob', s.url, e); return false; }
}

function fmtBytes(n) {
  if (!(n > 0)) return '';
  const un = ['B', 'KB', 'MB', 'GB'];
  let i = 0, v = n;
  while (v >= 1024 && i < un.length - 1) { v /= 1024; i++; }
  return (v >= 100 ? Math.round(v) : v.toFixed(1)) + ' ' + un[i];
}
function fmtMs(ms) {
  const s = Math.round(ms / 1000);
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

// ---------- Rádio: hora, clima e saudação ----------
let climaCache = null, climaAt = 0;
let radioClockTimer = 0, lastRadioHour = -1;
function periodOfDay() {
  const h = new Date().getHours();
  return h < 12 ? 'day' : h < 18 ? 'after' : 'night';
}
function clockSpeech() {
  const d = new Date();
  const h = d.getHours(), m = d.getMinutes();
  if (state.lang === 'en') return m ? `${h}:${String(m).padStart(2, '0')}` : `${h} o'clock`;
  if (state.lang === 'es') return m ? `${h} y ${m}` : `${h} en punto`;
  return m ? `${h} horas e ${m} minutos` : `${h} horas em ponto`;
}
function perLang(lang) { return state.lang === 'en' ? 'en' : state.lang === 'es' ? (lang === 'es' ? 'es' : 'pt-br') : 'pt-br'; }
async function fetchClima() {
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch('https://wttr.in/?format=j1&lang=' + perLang('pt-br'), { signal: ctl.signal });
    clearTimeout(t);
    if (!r.ok) return null;
    const j = await r.json();
    const cc = j && j.current_condition && j.current_condition[0];
    if (!cc) return null;
    const cand = state.lang === 'es' ? cc.lang_es : state.lang === 'en' ? cc.lang_en : cc.lang_pt;
    const desc = (cand && cand[0] && cand[0].value) || (cc.weatherDesc && cc.weatherDesc[0] && cc.weatherDesc[0].value) || '';
    const temp = String(cc.temp_C || '');
    climaCache = { desc, temp };
    climaAt = Date.now();
    return climaCache;
  } catch (e) { return null; }
}
function climaText() {
  if (!climaCache) return '';
  const clean = String(climaCache.desc || '').trim();
  const t = String(climaCache.temp || '').trim();
  if (state.lang === 'en') return [clean, t && `${t} degrees`].filter(Boolean).join(', ');
  if (state.lang === 'es') return [clean, t && `${t} grados`].filter(Boolean).join(', ');
  return [clean, t && `${t} graus`].filter(Boolean).join(', ');
}
async function radioWelcome(prefix) {
  try {
    if (!climaCache || Date.now() - climaAt > 30 * 60 * 1000) {
      await Promise.race([fetchClima(), new Promise((r) => setTimeout(r, 2600))]);
    }
  } catch (e) {}
  if (!state.radio || !state.djMode || !state.djVoice) return;
  const p = periodOfDay();
  const greet = L(p === 'day' ? 'dayGreet' : p === 'after' ? 'afterGreet' : 'nightGreet');
  const starter = L(p === 'day' ? 'dayStart' : p === 'after' ? 'afterStart' : 'nightStart');
  const s = state.current;
  const track = s ? ((s.artist ? s.artist + ', ' : '') + (s.title || '')) : '';
  const clima = climaText() ? ` ${L('weatherIntro', { w: climaText() })}` : '';
  const body = `${greet} ${L('clockIntro', { t: clockSpeech() })}${clima} ${starter} ${track}`.trim();

function startRadioClock() {

function pickDjVoice(u) {

  const myLang = (LANG_LOCALES[state.lang] || 'pt-BR').toLowerCase().slice(0, 2);
  const langPref = [myLang, 'pt', 'pt-BR', 'en', 'es'];
  const pick =
    langPref.map(l => vs.filter(v => (v.lang || '').toLowerCase().startsWith(l.toLowerCase()))
      .find(v => /female|feminina|femenine|woman|mulher|Paula|Helena|Samantha|Google UK English Female|Karen|Zira/i.test(v.name)))
      .find(Boolean) ||
    langPref.map(l => vs.find(v => (v.lang || '').toLowerCase().startsWith(l.toLowerCase())))

function djEngine(pool) {
  const set = pool.slice();
  if (!set.length) return [];
  const favSet = new Set(Array.from(state.favs));
  const disliked = [];
  const dislikedSet = new Set();
  for (const s of set) if (djLearnGet(s.id).skips >= 3) { disliked.push(s); dislikedSet.add(s.id); }
  const candidatesPool = disliked.length === set.length ? set.slice() : set.filter(s => !dislikedSet.has(s.id));
  const remaining = candidatesPool.slice();
  const out = [];
  const recent = [];
  const cap = 4;
  let guard = 0;
  while (remaining.length && guard < 20000) {
    guard++;
    let pick = null;
    if (favSet.size && Math.random() < 0.45) {
      const fs = remaining.filter(s => favSet.has(s.id) && !recent.includes(s.artist));
      if (fs.length) pick = fs[Math.floor(Math.random() * fs.length)];
    }
    let tries = 0;
    while (!pick && tries++ < 40) {
      const c = remaining[Math.floor(Math.random() * remaining.length)];
      const st = djLearnGet(c.id);
      if ((!recent.includes(c.artist) || tries > 30) && !(st.skips >= 1 && Math.random() < 0.55)) pick = c;
    }
    if (!pick) pick = remaining[0];
    remaining.splice(remaining.indexOf(pick), 1);
    recent.push(pick.artist);
    if (recent.length > cap) recent.shift();
    out.push(pick);
  }
  return out.concat(remaining);
}

function artistFacts(banda) {
  if (!banda) return null;
  try {
    const key = banda.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, '').trim();
    for (const k in ARTIST_FACTS_ALL) {
      if (k === key || key.includes(k) || k.includes(key)) {
        const arr = langArr(ARTIST_FACTS_ALL[k]);
        if (arr && arr.length) return arr;
      }
    }
  } catch (e) {}
  return null;
}
async function wikiSummary(term) {
  const lang = lyrTrLang();
  if (!term) return '';
  try {
    const sr = await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srlimit=1&srsearch=${encodeURIComponent(term)}`);
    if (!sr.ok) return '';
    const sj = await sr.json();
    const hit = sj && sj.query && sj.query.search && sj.query.search[0];
    if (!hit || !hit.title) return '';
    const sm = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(String(hit.title).replace(/ /g, '_'))}`);
    if (!sm.ok) return '';
    const mj = await sm.json();
    if (!mj || mj.type === 'disambiguation') return '';
    let ex = String(mj.extract || '').replace(/\s+/g, ' ').trim();
    if (!ex) return '';
    if (ex.length > 320) {
      const cut = ex.slice(0, 320);
      const dot = cut.lastIndexOf('. ');
      ex = dot > 80 ? cut.slice(0, dot + 1) : cut + '…';
    }
    return ex;
  } catch (e) { return ''; }
}

function tamiSleep(min) {
  const cycle = [15, 30, 60, 0];
  const cur = state.sleep || 0;
  let next = 0;
  if (min !== undefined) {
    if (cur === min) next = 0; else next = min;
  } else {
    next = cycle[(cycle.indexOf(cur) + 1) % cycle.length];
  }
  clearTimeout(state.sleepId);
  state.sleepId = null;
  state.sleep = next;
  if (next) {
    state.sleepId = setTimeout(() => {
      try { audio.pause(); } catch (e) {}
      try { video.pause(); } catch (e) {}
      ambStop();
      syncMini();
      renderAll();
      djSpeak(L('sleepOff'));
      state.sleep = 0; state.sleepId = null;
      renderVirgin();
    }, next * 60000);
    if (next > 2) {
      setTimeout(() => {
        if (state.sleep === next) djSpeak(L('sleepWarn'));
      }, (next - 2) * 60000);
    }
    djSpeak(L('sleepSet', { n: next }));
  } else {
    clearTimeout(state.sleepId);
    djSpeak(L('sleepCancel'));
  }
  renderVirgin();
}

function djNorm(t) {
  return String(t).toLowerCase()
    .replace(/[áàâãä]/g, 'a').replace(/[éèêë]/g, 'e').replace(/[íìîï]/g, 'i')
    .replace(/[óòôõö]/g, 'o').replace(/[úùûü]/g, 'u').replace(/ç/g, 'c');
}
function djCommand(raw) {
  const norm = djNorm(raw);
  const hasWake = /tami|tammi|tammy|tani/.test(norm);
  const action = /bombar|festa|balada|anima|party|fiesta|rancear/.test(norm) ? 'bombar'
    : /relaxa|calma|calm|tranquil|light|relax|suave/.test(norm) ? 'relaxar'
    : /curiosidade|fato curioso|sabia|curios|fact|interesting|dato|saber/.test(norm) ? 'curiosidade'
    : /locutor|radio\b|apresenta|announcer|present|anunci/.test(norm) ? 'locutor'
    : /piada|zoeira|conta|engracad|sorri|joke|funny|laugh|chiste|cuenta/.test(norm) ? 'piada'
    : /timer|dormi|dormir|sleep|deslig|apaga.*(min|minuto)|alarma|minutos?/.test(norm) ? 'timer'
    : /mix|mistura|mixa|shuffle/.test(norm) ? 'mix'
    : /odia|odeio|nao gostei|nao curti|hate|dislike|no me gusta|detesto/.test(norm) ? 'dislike'
    : /duplicad|repetid|duplicate|repeat/.test(norm) ? 'dupes'
    : /pula|pular|pule|skip|saltar/.test(norm) ? 'skip'
    : /proxima|passa|avanc|next|siguiente|adelante/.test(norm) ? 'next'
    : /anterior|volta|volt|back|previous|retroced/.test(norm) ? 'prev'
    : /pausa|parar|pare|stop|\bpara (a|o|de|com|por|agora)|pause\b/.test(norm) ? 'pause'
    : /toca|toque|continua|play|roda|resume|reanud/.test(norm) ? 'play'
    : /favorit|curti|gostei|amei|like|megusta|fav/.test(norm) ? 'fav'
    : /qual|essa|tocando|nome|what|playing|song|que suena|cual/.test(norm) ? 'info'
    : /recomend|suger|sugest|indica|dica|recommend|suggest|sugiere/.test(norm) ? 'recomenda'
    : /obrigad|valeu|thanks|thank|gracias/.test(norm) ? 'thanks'
    : /oi|ola|hello|hola|hi\b/.test(norm) ? 'hello'
    : null;
  if (!hasWake) return;
  if (!action) { djSpeak(L('comNo')); return; }
  const cur = state.current;
  switch (action) {
    case 'bombar': djSpeak(L('actBombar')); setTimeout(() => djMix('bombar'), 1500); break;
    case 'relaxar': djSpeak(L('actRelaxar')); setTimeout(() => djMix('relaxar'), 1500); break;
    case 'piada': setTimeout(tamiPiada, 600); break;
    case 'curiosidade': {
      djSpeak(L('actFact'));
      setTimeout(() => tamiCuriosidade({ generic: true }), 700);
      break;
    }
    case 'locutor': tamiLocutorToggle(); break;
    case 'timer': {
      const m = parseInt((norm.match(/(\d+)/) || [])[1], 10);
      if (m && m > 0 && m <= 120) { djSpeak(L('actTimer', { n: m })); tamiSleep(m); }
      else { djSpeak(L('actTimerAsk')); }
      break;
    }
    case 'mix': djSpeak(L('actMix')); setTimeout(djMix, 1500); break;
    case 'recomenda': djSpeak(L('actThink')); setTimeout(tamiRecomenda, 800); break;
    case 'dislike':
      djMarkDislike();
      djSpeak(L('actNoLike'));
      if (state.queue.length) next(true);
      break;
    case 'dupes':
      removeDuplicates();
      break;
    case 'skip':
      djMarkSkip();
      djSpeak(L('actSkip'));
      if (state.queue.length) next(true);
      break;
    case 'next':
      djMarkSkip();
      djSpeak(L('actNext'));
      if (state.queue.length) next(true);
      break;
    case 'prev': djSpeak(L('actPrev')); prev(); break;
    case 'pause': {
      const el2 = state.current && state.current.type === 'video' ? video : audio;
      if (el2.src && !el2.paused) { el2.pause(); djSpeak(L('actPause')); }
      break;
    }
    case 'play': {
      const el2 = state.current && state.current.type === 'video' ? video : audio;
      if (el2.src && el2.paused) { safePlay(el2); djSpeak('Tocando de novo!'); }
      break;
    }
    case 'fav':
      if (cur) { toggleFav(cur); djSpeak(L('actFav')); }
      break;
    case 'info':
      if (cur) djAnnounceTrack(cur); else djSpeak(L('actNothing'));
      break;
    case 'thanks': djSpeak(L('actThanks')); break;
    case 'hello': djSpeak(L('hello')); break;
  }
}

// ---------- Recomendações ----------
function learnArtistPref() {
  const pref = {};
  for (const s of state.songs) {
    const k = s.artist || UNKNOWN;
    if (!pref[k]) pref[k] = { artist: k, n: 0, plays: 0, likes: 0, skips: 0 };
    pref[k].n++;
    const l = djLearnGet(s.id);
    pref[k].plays += l.plays;
    pref[k].likes += l.liked ? 1 : 0;
    pref[k].skips += l.skips;
    if (state.favs.has(s.id)) pref[k].likes++;
  }
  return pref;
}
function songRecScore(s, pref) {
  const l = djLearnGet(s.id);
  if (l.skips >= 3) return -Infinity;
  const p = pref[s.artist] || { n: 0, plays: 0, likes: 0, skips: 0 };
  const known = p.plays > 0 || p.likes > 0;
  let score = 0;
  score += Math.min(p.plays * 0.6, 6);      // artistas que você mais ouve
  score += Math.min(p.likes * 2.2, 8);      // artistas com favoritas
  score += (l.liked ? 6 : 0) + (state.favs.has(s.id) ? 5 : 0);
  score += Math.min(l.plays, 3) * 0.4;      // músicas que você repete
  score -= l.skips * 1.5;                   // as que você pula
  score += known ? 2 : 0.5;                 // descoberta de artistas novos (leve)
  return score;
}
function recReason(s, pref) {
  const l = djLearnGet(s.id);
  if (state.favs.has(s.id) || l.liked) return 'Você curtiu ♥';
  const p = pref[s.artist];
  if (p && p.plays > 0) return 'Do artista que você mais ouve';
  if (p && p.likes > 0) return 'Você favoritou músicas dele';
  return 'Descoberta nova ✨';
}
function recommendTop(n) {
  const pref = learnArtistPref();
  return state.songs
    .filter(s => !s.type || s.type !== 'video')
    .map(s => ({ song: s, score: songRecScore(s, pref) }))
    .filter(x => x.score !== -Infinity)
    .sort((a, b) => b.score - a.score)
    .slice(0, n)
    .map(x => ({ song: x.song, reason: recReason(x.song, pref) }));
}
function tamiRecomenda() {
  const recs = recommendTop(10);

      <div class="mid"><div class="it-title">${esc(r.song.title)}</div><div class="it-sub">${esc(r.song.artist)} · ${esc(r.reason)}</div></div>
      <span style="color:var(--primary);font-size:15px">▶</span>

    `</div>

function playList(list, song) {
  if (!song || !list.length) return;
  djExit();
  state.queue = list;
  state.queueIndex = list.indexOf(song);
  if (state.queueIndex < 0) { state.queue.unshift(song); state.queueIndex = 0; }
  playCurrent();
  openPlayer();
}
function playVideo(v) {
  djExit();
  audio.pause();
  if (state.videoUrl) URL.revokeObjectURL(state.videoUrl);
  state.current = v;
  state.videoUrl = URL.createObjectURL(v.blob);
  openPlayer();
  renderPlayer();
  video.src = state.videoUrl;
  video.play().catch(() => {});
}
function showEl(id) {
  if (id === 'audio') { video.pause(); video.removeAttribute('src'); video.style.display = 'none'; audio.style.display = 'block'; }
  else { audio.pause(); audio.style.display = 'none'; video.style.display = 'block'; }
}
function playCurrent() {
  const s = state.queue[state.queueIndex];
  if (!s) return;
  state.current = s;
  if (state.videoUrl) { URL.revokeObjectURL(state.videoUrl); state.videoUrl = null; }
  renderPlayer();
  video.pause();
  video.removeAttribute('src');
  video.style.display = 'none';
  if (codecNeeded(s)) { setAudioSource(s); return; }
  if (s.type !== 'video' && s.url && !s.blob) {
    blobForSong(s).finally(() => { if (state.current === s) setAudioSource(s); });
    return;
  }
  setAudioSource(s);
}
function setAudioSource(s) {
  if (codecNeeded(s)) { nativeCodecStart(s); return; }
  if (state.codec) nativeCodecStop();
  audio.src = objUrl(s);
  audio.play().then(() => updateMediaSession()).catch(() => {});
  ensureHandoffPath(s);
  if (state.db) putKV('lastSong', { id: s.id });
  if (state.djMode) {
    if (s.id !== djLastId) { djLearnSet(s.id, { plays: djLearnGet(s.id).plays + 1 }); djLastId = s.id; }
    if (djEntered) djEntered = false;
    else if (!djAnnounced.has(s.id)) { djAnnounced.add(s.id); djAnnounceTrack(s); }

function syncMini() {

function installedVersion() {
  try { if (window.TamiNative && TamiNative.appVersion) return String(TamiNative.appVersion()); } catch (e) {}
  return '';
}
function versionNewer(a, b) {
  const pa = String(a || '').split(/[.\-+]/).map((n) => parseInt(n, 10) || 0);
  const pb = String(b || '').split(/[.\-+]/).map((n) => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x > y;
  }

}
async function loadApkInfo() {
  const parse = (t) => {
    const p = String(t).trim().split('|');
    return p.length >= 3 ? { build: p[0], ver: p[1], url: p[2] } : null;
  };
  try {
    const t = await (await fetch(VERSION_URL, { cache: 'no-store' })).text();
    const remote = parse(t);
    if (remote) { APK_INFO = remote; return APK_INFO; }
  } catch (e) {}
  try {
    const t = await (await fetch('./version')).text();
    const local = parse(t);
    if (local) APK_INFO = local;
  } catch (e) { APK_INFO.url = ''; }

}
function updateAvailable() {
  const inst = installedVersion();

async function pickMediaFolder() {
  if (!window.showDirectoryPicker) { toast('Pasta requer Chrome/Edge no Windows'); return null; }
  const dir = await window.showDirectoryPicker({ mode: 'read' });
  const files = [];
  async function walk(d) {
    for await (const [name, h] of d.entries()) {
      if (h.kind === 'file' && /\.(mp3|m4a|flac|ogg|wav|aac|opus|mp4|mkv|webm|mov|avi)$/i.test(name)) {
        const f = await h.getFile();
        Object.defineProperty(f, 'name', { value: name, configurable: true });
        if (/\.(mp3|m4a|flac|ogg|wav|aac|opus)$/i.test(name)) files.push({ f, kind: 'song' });
        else files.push({ f, kind: 'video' });
      }
      if (h.kind === 'directory') await walk(h);
    }
  }
  await walk(dir);
  return {
    songs: files.filter((x) => x.kind === 'song').map((x) => x.f),
    vids: files.filter((x) => x.kind === 'video').map((x) => x.f)
  };
}

// ---------- Duplicadas ----------
function dupKey(s) {
  const t = String(s.title || s.name || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const a = String(s.artist || '').trim().toLowerCase();
  return (t || '?') + '|' + a;
}
function findDuplicates() {
  const groups = new Map();
  for (const s of state.songs) {
    const k = dupKey(s);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  }
  return [...groups.values()].filter((g) => g.length > 1);
}
async function removeDuplicates() {
  const groups = findDuplicates();
  const extras = groups.reduce((acc, g) => acc.concat(g.slice(1)), []);
  if (!extras.length) {
    djSpeak(L('dupNone'));
    toast('Nenhuma duplicada encontrada 😊');
    return;
  }
  const list = $('modal');
  list.innerHTML = `<h3>Duplicadas (${extras.length})</h3>
    <div class="list" style="max-height:50vh;overflow-y:auto;padding:0">` +
    groups.map((g) => `<div class="section" style="padding:10px 8px 4px">${esc(g[0].title || g[0].name)} — ${esc(g[0].artist || '')}</div>` +
      g.slice(1).map((s) => `<div class="mrow" style="color:var(--text2)">🗑 ${esc(s.title || s.name)}</div>`).join('')).join('') +
    `</div>
    <div id="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn secondary" onclick="confirmByVoice()">🎙 Confirmar por voz</button>
      <button class="btn" onclick="deleteDupes()">Remover ${extras.length}</button>
    </div>`;
  $('modal-wrap').classList.add('show');
  djSpeak(L('dupFound', { n: extras.length }));
}
function confirmByVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voz não suportada — toque em "Remover".'); return; }
  const ids = [];
  for (const g of findDuplicates()) ids.push(...g.slice(1).map((s) => s.id));
  if (!ids.length) { toast('Nada a remover'); return; }
  djSpeak(L('dupAsk'));
  const r = new SR();
  r.lang = LANG_LOCALES[state.lang] || 'pt-BR'; r.continuous = false; r.interimResults = false; r.maxAlternatives = 3;
  let done = false;
  const finish = () => { done = true; try { r.stop(); } catch (e) {} r.onresult = r.onerror = r.onend = null; };
  r.onresult = (ev) => {
    const t = djNorm((ev.results[ev.results.length - 1][0] || {}).transcript || '');
    if (done) return;
    if (/^(sim|quero|pode|ok|claro|remove|apaga|confir|yes|si\b|adelante)/.test(t)) { finish(); djSpeak(L('dupYes')); deleteDupes(ids); }
    else if (/^(nao|cancela|no\b)/.test(t)) { finish(); djSpeak(L('dupNo')); }
  };
  r.onerror = () => { if (!done) toast('Não consegui ouvir — toque em "Remover".'); };
  r.onend = () => { if (!done) { try { r.start(); } catch (e) { finish(); } } };
  try { r.start(); } catch (e) { toast('Não consegui ouvir — toque em "Remover".'); }
}
async function deleteDupes(idsArg) {
  let ids = idsArg;
  if (!ids) {
    ids = [];
    for (const g of findDuplicates()) ids.push(...g.slice(1).map((s) => s.id));
  }
  if (!ids.length) return;
  closeModal();
  for (const id of ids) {
    const it = state.songs.find((x) => x.id === id);
    deleteHandoffCache(it);
    await delObj('songs', id);
    state.favs.delete(id);
    if (state.learn[id]) { delete state.learn[id]; }
    if (objectUrlCache.has(id)) { URL.revokeObjectURL(objectUrlCache.get(id)); objectUrlCache.delete(id); }
    revokeCover(id);
    for (const p of state.playlists) {
      if (p.songIds && p.songIds.includes(id)) { p.songIds = p.songIds.filter((x) => x !== id); await putPlaylist(p); }
    }
  }
  await putKV('favs', [...state.favs]);
  if (Object.keys(state.learn).length) await putKV('learn', state.learn);
  state.queue = state.queue.filter((x) => !ids.includes(x.id));
  await reloadAll();
  toast('Duplicadas removidas!');
}

  if (objectUrlCache.has(id)) { URL.revokeObjectURL(objectUrlCache.get(id)); objectUrlCache.delete(id); }
  revokeCover(id);

    });

function companionExec(cmd, value) {
  try {
    switch (cmd) {
      case 'toggle': togglePlay(); break;
      case 'next': pjNext(); break;
      case 'prev': prev(); break;
      case 'seek': {
        const t = Math.max(0, (+value || 0) / 1000);

        else audio.currentTime = t;
        break;
      }
      case 'volume': {
        const v = Math.min(100, Math.max(0, +value || 0)) / 100;
        audio.volume = v; video.volume = v;
        break;
      }
    }
  } catch (e) {}
}
function companionState() {

  const cur = state.current ? {
    id: state.current.id, title: state.current.title, artist: state.current.artist,
    album: state.current.album, durationMs: state.current.durationMs
  } : null;
  return {
    ts: Date.now() / 1000,
    app: installedVersion() || '',
    playing: !!(el && el.src && !el.paused),
    current: cur,
    positionMs: el && el.src ? Math.round((el.currentTime || 0) * 1000) : 0,
    durationMs: el && el.src && el.duration ? Math.round(el.duration * 1000) : ((cur && cur.durationMs) || 0),
    volume: Math.round((el && el.volume != null ? el.volume : 1) * 100),

    vl.oninput = () => { clearTimeout(t); t = setTimeout(() => phoneVolume(vl.value), 250); };
  }
}
function startPhonePoll() {
  clearInterval(phoneTimer);
  phoneTimer = setInterval(pollRemote, 3000);
  pollRemote();
}

// ---------- Boot ----------
async function reloadAll() {
  try { state.songs = await getAll('songs'); } catch (e) { state.songs = []; }
  try { state.videos = await getAll('videos'); } catch (e) { state.videos = []; }
  try { state.playlists = await getAll('playlists'); } catch (e) { state.playlists = []; }
  await syncAnimesPlaylist();
  buildAlbums();
  renderAll();
}
async function init() {
  try { registerTabs(); } catch (e) { console.warn('tabs', e); }
  applyLang();
  state.db = await ensureDB();
  if (!state.db) {
    toast('Armazenamento indisponível — vou tentar de novo em instantes.');
    (async () => {
      for (let i = 0; i < 6 && !state.db; i++) {
        await new Promise((r) => setTimeout(r, 5000));
        state.db = await ensureDB();
        if (state.db) { await reloadAll(); toast('Armazenamento restabelecido.'); }
      }
    })();
  }
  await reloadAll();
  try {
    const favs = await getKV('favs');
    if (favs) state.favs = new Set(favs);
    const learn = await getKV('learn');
    if (learn) state.learn = learn;
    const nick = await getKV('nick');
    if (nick) { state.nick = nick; $('profile-avatar').textContent = initials(nick); }
    const theme = await getKV('theme');
    if (theme) { state.theme = theme; applyTheme(); }
    const accent = await getKV('accent');
    if (accent && ACCENTS.includes(accent)) { state.accent = accent; applyTheme(); }
    const visStyle = await getKV('visStyle');
    if (visStyle && VIS_STYLES.includes(visStyle)) {
      state.visStyle = visStyle;
      const vb = $('vis-style'); if (vb) vb.textContent = VIS_ICONS[visStyle];
    }
    const amb = await getKV('amb');
    if (amb) { state.amb = Object.assign(state.amb, amb); state.amb.playing = false; }
    const idx = await getKV('lastSong');
    if (idx && state.songs.length) {
      const i = state.songs.findIndex((s) => s.id === idx.id);
      if (i >= 0) {
        state.queue = state.songs.slice(i).concat(state.songs.slice(0, i));
        state.queueIndex = 0;
        playCurrent(); syncMini();
      }
    }
  } catch (e) { console.warn('restore', e); }
  try { renderAll(); } catch (e) { console.warn('render', e); }
  try { startPhonePoll(); } catch (e) {}
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.register) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) {}
  document.addEventListener('pointerdown', function djWelcome() {
    if (state.djVoice) djSpeak(L('welcome'));
  }, { once: true, passive: true });
  document.addEventListener('pointerdown', () => { ensureVis(); }, { passive: true });
  try { startVis(); } catch (e) {}
  try { checkBackgroundHandoff(); } catch (e) {}
  try { maybeShowWhatsNew(); } catch (e) {}
  if (window.TamiNative) {
    loadApkInfo().then(() => {
      if (updateAvailable()) {
        toast('Atualização da TAMI ' + APK_INFO.ver + ' disponível!');
        setTimeout(showUpdateDialog, 1500);
      }
    }).catch(() => {});
  }
  window.__tamiBooted = true;
  renderVirgin();
}
function registerTabs() {
  $('fileSongs').onchange = (e) => { if (e.target.files.length) importFiles([...e.target.files], 'song'); e.target.value = ''; };
  $('fileVideos').onchange = (e) => { if (e.target.files.length) importFiles([...e.target.files], 'video'); e.target.value = ''; };
  $('search').oninput = () => { searchQ = $('search').value.trim().toLowerCase(); renderAll(); if (state.detail) { state.detail = null; selectTab(state.tab); } };
  $('vol').oninput = () => { const v = +$('vol').value; audio.volume = v; video.volume = v; };
  $('p-speed').onclick = cycleSpeed;
  let dragDepth = 0;
  document.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; $('drop-overlay').classList.add('show'); });
  document.addEventListener('dragleave', (e) => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; $('drop-overlay').classList.remove('show'); } });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', async (e) => {
    e.preventDefault(); dragDepth = 0; $('drop-overlay').classList.remove('show');
    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
    if (!files.length) return;
    const songs = files.filter((f) => /\.(mp3|m4a|flac|ogg|wav|aac|opus)$/i.test(f.name));
    const vids = files.filter((f) => /\.(mp4|mkv|webm|mov|avi)$/i.test(f.name));
    if (songs.length) await importFiles(songs, 'song');
    if (vids.length) await importFiles(vids, 'video');
    if (!songs.length && !vids.length) toast('Arraste arquivos de áudio/vídeo');
  });
  // Bus topology: um único botão de importação flutuante
  createFab();
}
async function scanDeviceMusic() {
  if (!(window.TamiNative && window.TamiNative.scanMusic)) { toast('Localização automática disponível no app Android.'); return; }
  if (!(await ensureDB())) { toast('Armazenamento indisponível.'); return; }
  toast('Lendo músicas do aparelho…');
  let list;
  try { list = JSON.parse(window.TamiNative.scanMusic()) || []; } catch (e) { list = []; }
  if (!list.length) { toast('Nenhuma música encontrada — se o app pediu permissão, permita e toque de novo.'); return; }
  const existing = new Set(state.songs.map((s) => s.url).filter(Boolean));
  let added = 0;
  for (const m of list) {
    if (existing.has(m.u)) continue;
    existing.add(m.u);
    try {
      await putSong({
        id: 'l' + seedHash(m.u).toString(36) + '-' + Math.random().toString(36).slice(2, 8),
        title: m.n || 'Música', artist: m.a || 'Artista desconhecido',
        album: m.b || UNKNOWN, year: new Date().getFullYear(),
        durationMs: m.d || 0, type: 'song', url: m.u,
        name: (m.n || 'Música') + '.mp3', createdAt: Date.now()
      });
      added++;
    } catch (e) { console.warn('scan', e); }
  }
  await reloadAll();
  if (added) buildAlbums();
  toast(added ? `Localizadas ${added} músicas no aparelho.` : 'Músicas do aparelho já estão todas aqui.');
}
function shareApp() {
  if (!(window.TamiNative && window.TamiNative.shareApk)) { toast('Disponível no app instalado (Android).'); return; }
  try {
    if (window.TamiNative.shareApk() !== 'ok') toast('Não foi possível compartilhar o APK.');
  } catch (e) { toast('Não foi possível compartilhar o APK.'); }
}

  const fab = document.createElement('button');
  fab.id = 'fab';
  fab.style.cssText = `position:fixed;z-index:10;right:18px;bottom:132px;width:58px;height:58px;border-radius:50%;border:none;background:var(--primary-dark);color:#fff;font-size:28px;box-shadow:0 8px 24px rgba(124,77,255,.4);cursor:pointer;`;
  fab.textContent = '＋';
  fab.onclick = () => {
    const list = $('modal');
    list.innerHTML = `<h3>Importar mídia</h3>
      <div class="mrow" onclick="importPrompt()"><span class="art grad-e">♪</span><div class="mid"><div class="it-title">Músicas</div><div class="it-sub">Selecionar arquivos de áudio</div></div></div>
      <div class="mrow" onclick="scanDeviceMusic()"><span class="art grad-d">📂</span><div class="mid"><div class="it-title">Músicas do aparelho</div><div class="it-sub">Ler tudo automaticamente (Android)</div></div></div>
      <div class="mrow" onclick="$('fileVideos').click()"><span class="art grad-c">▷</span><div class="mid"><div class="it-title">Vídeos</div><div class="it-sub">Selecionar arquivos de vídeo</div></div></div>
      <div class="mrow" onclick="pickFolder()"><span class="art grad-b">📁</span><div class="mid"><div class="it-title">Pasta inteira</div><div class="it-sub">Chrome/Edge no Windows</div></div></div>
      <div class="mrow" onclick="pickNovidades()"><span class="art grad-b">🔎</span><div class="mid"><div class="it-title">Buscar novidades na pasta</div><div class="it-sub">Reler a pasta e importar só o que é novo</div></div></div>
      <div class="mrow" onclick="checkNovidades()"><span class="art grad-e">✨</span><div class="mid"><div class="it-title">Buscar novidades de versão</div><div class="it-sub">Verifica atualização do app no GitHub</div></div></div>
      <div class="mrow" onclick="removeDuplicates()"><span class="art grad-a">♻</span><div class="mid"><div class="it-title">Remover músicas duplicadas</div><div class="it-sub">A TAMI encontra e remove repetidas</div></div></div>
      <div class="mrow" onclick="shareApp()"><span class="art grad-b">📤</span><div class="mid"><div class="it-title">Compartilhar app (APK)</div><div class="it-sub">Envia uma cópia do TAMI salva em Downloads</div></div></div>
      <div id="modal-actions"><button class="btn secondary" onclick="closeModal()">Fechar</button></div>`;
    $('modal-wrap').classList.add('show');
  };
  document.body.appendChild(fab);
}
probeCompanion();
init();
