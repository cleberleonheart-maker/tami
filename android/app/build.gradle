plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def senhaKs = System.getenv('TAMIKS_PASS') ?: 'tami123'
def tamiKs = rootProject.file('keystore/tami.keystore')

android {
    namespace 'com.tami.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tami.app"
        minSdk 24
        targetSdk 34
        versionCode ((project.findProperty('versionCode') as String ?: '1').toInteger())
        versionName (project.findProperty('versionName') as String ?: '1.0')
    }

    signingConfigs {
        release {
            if (tamiKs.exists()) {
                storeFile tamiKs
                storePassword senhaKs
                keyAlias 'tami'
                keyPassword senhaKs
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (tamiKs.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
